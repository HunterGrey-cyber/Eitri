# 所有 tmux server 共用的底座：日常 tmux（tmux.conf）和三个 Claude 账号后台
# （tmux-<host> 里的 claude-*.conf）都先 source 这份。
# 这里只放"跟主题/主机/账号无关"的东西——按键、复制模式、Claude 兼容、插件声明。
# 不在这里 `run` tpm：tmux-power 在 run 那一刻读取 @tmux_power_* 选项渲染状态栏，
# 所以必须由各自的顶层配置先设好主题色，再自己 run。
# 也不在这里绑 <前缀> r：每个顶层配置要重载的是它自己那份文件。

##### Core

# 前缀键从默认的 Ctrl-b 换成 Ctrl-a（离左手小指更近）
set -g prefix C-a
unbind C-b
# 连按两下 Ctrl-a：第二下原样发给里面的程序（比如 vim/readline 自己也用 Ctrl-a 跳到行首）
bind C-a send-prefix

set -s escape-time 0        # 去掉 tmux 等 Esc 后续按键的延迟，按 Esc 不再有肉眼可见的卡顿
set -g focus-events on      # 把终端窗口的聚焦/失焦事件转发给里面的程序（vim 的自动读盘等依赖这个）
set -g mouse on             # 开鼠标：点击切换面板/窗口、滚轮滚动、拖拽选中文字
set -g base-index 1         # 窗口编号从 1 开始（tmux 默认从 0）
setw -g pane-base-index 1   # 面板编号同样从 1 开始
setw -g mode-keys vi        # 复制模式（copy-mode）用 vi 风格按键：hjkl 移动、v 选中、y 复制……

set -g default-terminal "tmux-256color"    # 告诉里面的程序"你现在在什么终端里"，这是社区推荐值
set -ga terminal-overrides ",*256col*:Tc"  # 追加声明支持 24 位真彩色（Tc）

# 认领真彩色 + 同步刷新（DECSET 2026）——这两条是让外层终端知道 tmux 支持什么能力。
# foot 对外报的是 xterm-256color（foot.ini 里的 `term=`），tmux 内置的 xterm* 能力表
# 本身不含 RGB 和 sync，不加 sync 的话每次刷新都不同步，快速滚动时画面会撕裂。
# extkeys/clipboard/hyperlinks/usstyle 是给 Claude Code 用的（见下面"Claude Code 兼容性"）：
# 这几个标记必须挂在真正命中的 xterm-256color 这条上——之前误挂在 foot* 那条，因为 TERM
# 实际报的是 xterm-256color，foot* 根本不会命中，标记形同虚设。
set -as terminal-features ",xterm-256color:RGB:sync:extkeys:clipboard:hyperlinks:usstyle"
# foot* 这条留着做前向兼容占位（万一以后 foot.ini 的 term= 改成报 "foot"），目前不会命中。
set -as terminal-features ",foot*:RGB:sync:extkeys:hyperlinks:usstyle:clipboard"

##### Claude Code 兼容性
# 官方文档：https://code.claude.com/docs/en/terminal-config#configure-tmux
# 不加这三行，tmux 里跑 Claude Code 会出两个问题：Shift+Enter 变成直接提交（而不是插入
# 换行），桌面通知/进度条到不了外层终端。
set -g allow-passthrough on   # 放行内层程序发给外层终端的转义序列（通知、进度条）
set -s extended-keys on       # 让 tmux 能分清 Shift+Enter 和普通 Enter
# 允许内层程序（比如 Claude 的 /copy，走 OSC 52）把内容写到真正的系统剪贴板，而不是
# 只写进 tmux 自己的 paste buffer。没这行，原生复制会静默失败，只能靠下面手动选区+y。
set -g set-clipboard on

##### Panes（分屏、切换、调整大小）
bind \\ split-window -h -c "#{pane_current_path}"   # 竖着分屏（左右），沿用当前目录
bind - split-window -v -c "#{pane_current_path}"    # 横着分屏（上下），沿用当前目录
unbind %
unbind '"'

# 重新排布已有面板而不重新创建（跟上面的 \ / - 分屏方向对应）
bind | select-layout even-horizontal
bind _ select-layout even-vertical

# 不用切前缀重复按：调整当前面板大小，方向跟 vim 的 hjkl 一致
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z    # 放大/还原当前面板（zoom）

# 大写 HJKL：把当前面板跟指定方向的面板互换位置（不是移动光标，是交换内容）
bind H swap-pane -t '{left-of}'
bind J swap-pane -t '{down-of}'
bind K swap-pane -t '{up-of}'
bind L swap-pane -t '{right-of}'

bind x kill-pane                                 # 关掉当前面板
bind q kill-window                               # 关掉当前窗口（连带里面所有面板）
# 裸 Ctrl-l 被下面"vim-aware 面板导航"占用去切面板了，这里用 <前缀> Ctrl-l 把真正的
# Ctrl-l（清屏/redraw）原样发给当前面板里的程序
bind C-l send-keys C-l

##### Copy mode（复制模式：进入后可以用 vi 键位翻看历史、选中文字）
set -g history-limit 50000          # 每个面板保留的滚动历史行数；tmux-sensible 也会设，这里显式写一遍图省心

# pane-scrollbars 故意关掉：进入复制模式的瞬间滚动条那一列会把面板往里挤一格，但鼠标拖拽
# 选区还是按挤之前的坐标算，选区会偏一列。
setw -g pane-scrollbars off

bind P paste-buffer                                          # 粘贴最近一次复制的内容
bind -T copy-mode C-S-Home send -X history-top                # 复制模式里 Ctrl-Shift-Home 跳到最早的历史
bind -T copy-mode-vi v send -X begin-selection                # v 开始选中（跟 vim 一样）
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"  # y 复制选中内容到系统剪贴板（Wayland）并退出复制模式
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"  # 鼠标拖拽选完松手也一样复制

# 滚轮每次滚 3 行，比默认的 5 行更细，跟得上快速滚动又不会一下子跳太多
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 3 scroll-down

# 终端风格的 Shift+PageUp/PageDown 翻页。foot.ini 里把这两个键的默认绑定设成了 none
# （反正也用不上：tmux 用的是 alternate screen，foot 自己的 scrollback 永远是空的），
# 所以这两个键会原样传到 tmux 这里来处理。
bind -n S-PageUp copy-mode -eu                    # Shift+PageUp：进入复制模式并往上翻一页
bind -T copy-mode-vi S-PageUp   send -X page-up   # 复制模式里再按 Shift+PageUp 继续往上翻
bind -T copy-mode-vi S-PageDown send -X page-down # 复制模式里 Shift+PageDown 往下翻

# <前缀> b：把当前面板的历史滚动内容丢进一个全屏弹窗，用 less 查看/搜索。
# tmux 本身在面板变宽/取消 zoom 时就会自动重排软换行的历史，所以这不是为了解决换行问题；
# 真正加的是 `capture-pane -J`（把折行拼回一整行，复制长路径/URL 时不会夹带换行符）和
# less 自带的搜索。像 eza/ls 的列、git log --graph、--help 的输出、p10k 右侧提示这些
# 本来就是程序自己按窄面板硬换行 + 打空格对齐的，重排和 -J 都救不了，宽度就是原来那么窄。
bind b capture-pane -eJ -S - \; \
  display-popup -E -B -w 100% -h 100% 'tmux save-buffer - | less -R +G; tmux delete-buffer'

##### Window naming（窗口命名）
# 窗口名固定显示"当前目录名"，而不是 tmux 默认的"当前在跑的命令名"（跑起来之后默认会
# 变成 "nvim"/"python" 这种，容易一堆窗口全叫一样的名字分不清是哪个目录）。
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

##### Vim-aware pane navigation（面板导航：裸 Ctrl-hjkl 切面板，但 vim/fzf 里让它们正常工作）
# 判断当前面板里跑的前台进程是不是 vim 系（含 view/gvim/nvim 等变体）或 fzf：如果是，
# Ctrl-hjkl 就该照常发给它（vim 自己也用这几个键切分屏），不是的话才拿来给 tmux 切面板。
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# 复制模式里就不用判断了（复制模式本来就不是在跟 vim 交互），直接切面板
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

##### Plugins（插件，用 tpm 管理）
##### Claude 用量状态栏的显示档位
# 段本身（@tmux_power_right_w）由各顶层配置声明：<host> 上是三个账号配置，PC 上是
# 它自己的 theme.conf——因为显示哪个账号完全由 tmux server 环境里的
# CLAUDE_CONFIG_DIR 决定，日常 tmux 没这个变量，挂了只会显示空的 NULL namespace。
#
# 但这个键绑定是跟主题/主机/账号都无关的，所以归 base.conf：它原来写在 tmux.conf
# 里（挨着段的注释），结果两个 max 后台只 source base.conf、根本没拿到这个绑定。
#
# 档位存在 @claude_usage_mode，段写成 '#(claude-usage-status #{@claude_usage_mode})'
# ——tmux 会在 #() 的参数里展开格式串并且每次刷新重新展开，所以切档只要改那个 option。
# 没声明段的 server 上按了也无害，只是没人读那个 option。
# U/h/i/o/M-u 都被占了（tpm 的更新/安装/清理，还有面板调整、display-message），y 是空的。
bind y run-shell "~/.local/bin/claude-usage-mode"       # 循环 收缩 / 百分比+时间 / 完全展开

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# tmux-power 不走 tpm：整套 Claude tab 上色都架在对它的本地改动上，而那份改动原来
# 是 tpm clone 里的未提交修改，一次 <prefix> U 就可能被拉没。现在它 vendor 在
# vendor/tmux-power/（不是 plugins/，那是 tpm 的地盘），由各顶层配置在 tpm 之后
# 自己 run，来源和改了什么见 vendor/tmux-power/UPSTREAM.md。

# TPM 找插件目录靠 TMUX_PLUGIN_MANAGER_PATH 这个环境变量，不设的话默认去 ~/.tmux/plugins/
# 找。这台机器的插件已经搬到 XDG 目录 ~/.config/tmux/plugins/ 了——里面除了官方插件，
# 还有一份带自定义 right_w/x/y/z segment 槽位的 tmux-power fork，theme.conf 里的
# Claude usage 状态栏、fcitx5 输入法指示器，以及 Claude 运行状态给窗口 tab 上色，全靠这个
# fork 才能显示。
# 这条以前是手动 `tmux set-environment -g` 上去的，只存在于跑着的 server 进程内存里，
# 完全不在版本控制范围内——server 一旦重启（重启机器、tmux kill-server、升级 tmux）,
# 这条设置就没了，TPM 会静默换回官方原版 tmux-power（没有 right_w/x/y/z），右边状态栏
# 那几格会悄无声息地消失，不会报错。现在写死在这里，不再是隐藏的运行时状态。
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
