#
#
#
#
#
#

#

#
set -g prefix C-a
unbind C-b
#
bind C-a send-prefix

set -s escape-time 0
set -g focus-events on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

#
#
#
#
#
#
set -as terminal-features ",xterm-256color:RGB:sync:extkeys:clipboard:hyperlinks:usstyle"
#
set -as terminal-features ",foot*:RGB:sync:extkeys:hyperlinks:usstyle:clipboard"

#
#
#
#
set -g allow-passthrough on
set -s extended-keys on
#
#
set -g set-clipboard on

#
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

#
bind | select-layout even-horizontal
bind _ select-layout even-vertical

#
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

#
bind H swap-pane -t '{left-of}'
bind J swap-pane -t '{down-of}'
bind K swap-pane -t '{up-of}'
bind L swap-pane -t '{right-of}'

bind x kill-pane
bind q kill-window
#
#
bind C-l send-keys C-l

#
set -g history-limit 50000

#
#
setw -g pane-scrollbars off

bind P paste-buffer
bind -T copy-mode C-S-Home send -X history-top
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

#
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 3 scroll-down

#
#
#
bind -n S-PageUp copy-mode -eu
bind -T copy-mode-vi S-PageUp   send -X page-up
bind -T copy-mode-vi S-PageDown send -X page-down

#
#
#
#
#
bind b capture-pane -eJ -S - \; \
  display-popup -E -B -w 100% -h 100% 'tmux save-buffer - | less -R +G; tmux delete-buffer'

#
#
#
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

#
#
#
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

#
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

#
#
#
#
#
#
#
#
#
#
#
#
#
bind y run-shell "~/.local/bin/status-mode"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
#
#
#
#

#
#
#
#
#
#
#
#
#
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
