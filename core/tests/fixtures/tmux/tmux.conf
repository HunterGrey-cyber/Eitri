# 日常 tmux（<hosts>，default socket）的顶层配置。
# claude pro 账号后台（tmux-<host> 的 claude-pro.conf）也整份继承这里。
source-file ~/.config/tmux/base.conf

# 加载本机专属的主题配置（必须在 tpm run 之前，theme.conf 里设的 @tmux_power_* 变量
# 要在 tmux-power 插件真正加载渲染之前就准备好）
if-shell "[ -f ~/.config/tmux/theme.conf ]" 'source ~/.config/tmux/theme.conf'

# tpm 本体这份可执行脚本放在跟插件同一棵目录树下，纯粹图清晰——它自己的逻辑其实是看
# base.conf 里那条 TMUX_PLUGIN_MANAGER_PATH 决定去哪找插件，不是看这个路径。
run '~/.config/tmux/plugins/tpm/tpm'

# vendor 的 tmux-power：必须在自己那批 @tmux_power_* 选项都设完之后才 run
run '~/.config/tmux/vendor/tmux-power/tmux-power.tmux'

bind r source-file ~/.config/tmux/tmux.conf      # 重新加载这份配置，不用重开 tmux

