[package]
name = "neovibe-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
# Lets `shell`'s tests use `test_providers`' doubles.
test-support = []

[dependencies]
agent = { path = "../agent" }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# msgpack-RPC for `editor_quit_with_real_nvim.rs`, which is the only real-nvim test here that needs
# to talk RPC rather than read a socket the Lua side pushed to. Already resolved in Cargo.lock
# (1.3.1) through the Neovide fork, so nothing new is downloaded, and it is a dev-dependency, so
# `packaging/collect-licenses.py` is not involved.
rmpv = "1"
