[package]
name = "eitri-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Lets `shell`'s tests use `test_providers`' doubles.
test-support = []
# The development-only legacy backend, off by default and in no release (spec
# 2026-09-27-v1-dist-design.md §10, D16): forwarded to `agent`, which holds every `cfg`. Without it,
# `AgentBackend::Legacy` still compiles but can never be constructed.
legacy-backend = ["agent/legacy-backend"]

[dependencies]
agent = { path = "../agent" }
libc = "0.2"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# msgpack-RPC to a user's own nvim (companion mode). Already linked into `shell` through the Neovide fork at
# 1.3.1, so no new crate ships and the licence set does not change.
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already linked through `agent`, so no new crate ships: the tmux import's fingerprint.
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# The crate's own test doubles (`PresenceGuard::for_tests`, `EditorClear::for_tests`) for its
# integration tests, which see it only as an outside crate.
eitri-core = { path = ".", features = ["test-support"] }
