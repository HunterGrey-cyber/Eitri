[package]
name = "eitri-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Lets `shell`'s tests use `test_providers`' doubles.
test-support = []
# The development-only legacy backend is off by default and absent from releases.
# Forwarded to `agent`, which holds every `cfg`; without it,
# `AgentBackend::Legacy` still compiles but can never be constructed.
legacy-backend = ["agent/legacy-backend"]

[dependencies]
agent = { path = "../agent" }
libc = "0.2"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# msgpack-RPC to a user's own nvim (companion mode). Already linked into `shell` through the Neovide fork at
# 1.3.1, so no new crate ships and the licence set does not change.
rmpv = "1"
serde = { version = "1", features = ["derive"] }
# `unbounded_depth` only adds a switch to lift the parser's 128-level limit, which a deep layout file
# exceeds (three levels of JSON per container); the layout reader sets its own bound before parsing.
serde_json = { version = "1", features = ["unbounded_depth"] }
# `Sec-WebSocket-Accept` in the IDE listener's handshake. RustCrypto, beside `sha2` and on its `digest`; its licence
# is `MIT OR Apache-2.0`. A new crate in the shipped set, with nothing behind it that the tree does not have already.
sha1 = { version = "0.10", default-features = false }
# Already linked through `agent`, so no new crate ships: the tmux import's fingerprint.
sha2 = "0.10"
# Reads Codex's TOML configuration for the trust prompt. Already linked into `shell` at 0.9.12 through
# the Neovide fork, so no new crate ships and the licence set does not change.
toml = "0.9.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# The crate's own test doubles (`PresenceGuard::for_tests`, `EditorClear::for_tests`) for its
# integration tests, which see it only as an outside crate.
eitri-core = { path = ".", features = ["test-support"] }
# The scripted Claude harness (`agent::testkit`) and the ingestion's history and fold-log accessors, for
# the layer (b) tests in `tests/claude_scripted/`.
agent = { path = "../agent", features = ["test-support"] }
