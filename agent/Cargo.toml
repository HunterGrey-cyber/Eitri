[package]
name = "agent"
version.workspace = true
edition = "2024"
publish.workspace = true

[dependencies]
eitri-server-proto = { path = "../server-proto" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a chat moved to the other window crosses as JSON and must read back value for
# value, floats included; the default parser can land one bit off. No extra crate.
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4"] }
claude-runtime-protocol = { workspace = true }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
sha2 = "0.10"
# The restore reader describes the images a transcript line holds (their type, size and digest); the same
# base64 0.22 the other crates use.
base64 = "0.22"
libc = "0.2"
# Only the scripted stand-in child (`eitri-agent-standin`) matches lines with it; already in the
# lock file through other crates, and absent from a build without `test-support`.
regex = { version = "1", optional = true }

# The legacy backend (`AgentSession`: this crate spawning `claude` itself, parsing its stream-json
# wire, relaying its `PreToolUse` hook through `agent-hook`) is development-only and is in no release
# (it is kept for development only, so no release ships it). Off by
# default, so any `cargo build` -- `release.sh`, the AUR `-git` PKGBUILD, `install.sh --from-source`,
# a README reader -- leaves it out without having to remember a flag. Without it, `AgentSession` is
# the uninhabited stub in `src/session_stub.rs`, so `eitri-core` and `shell` compile unchanged.
# Development asks for it with `--features shell/legacy-backend` (forwarded by both).
[features]
legacy-backend = []
# The crate's own test doubles for its integration tests, which see it only as an outside crate:
# the scripted stand-in child that plays an agent's stdio (`eitri-agent-standin`), and the seams of
# `private_fs::replace_private` (`private_fs::replace_test_hooks`) other crates' tests use.
test-support = ["dep:regex"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
agent = { path = ".", features = ["test-support"] }

# The legacy gate's relay, located only by `settings::locate_agent_hook_binary` on the legacy spawn
# path: without the feature there is nothing for it to relay to, so it is not built. A release then
# has six binaries: shell, eitri-tmux-shim, eitri-claude-handoff, eitri-run-guard,
# eitri-editor-bridge, eitri-server.
[[bin]]
name = "agent-hook"
path = "src/bin/agent-hook.rs"
required-features = ["legacy-backend"]

# A child that plays a JSON script on its stdio (lines to write, regexes to expect, sleeps, exit codes),
# standing in for an agent such as `codex app-server` in the `JsonRpcLink` tests. Never shipped.
[[bin]]
name = "eitri-agent-standin"
path = "src/bin/eitri-agent-standin.rs"
required-features = ["test-support"]

# The scripted Messages API stand-in as a process: `eitri-claude-scripted serve <dir>` answers a CLI from the
# script in `<dir>/script.json`. Never shipped.
[[bin]]
name = "eitri-claude-scripted"
path = "src/bin/eitri-claude-scripted.rs"
required-features = ["test-support"]

# A relay in front of the real Claude CLI that copies its stdio unchanged and logs both directions line
# by line under one arrival index, for the Claude harness. Never shipped.
[[bin]]
name = "eitri-stdio-tap"
path = "src/bin/eitri-stdio-tap.rs"
required-features = ["test-support"]

# The transcript oracle: a Claude CLI session's files against Eitri's records of it, redacted by default.
# Never shipped.
[[bin]]
name = "eitri-transcript-oracle"
path = "src/bin/eitri-transcript-oracle.rs"
required-features = ["test-support"]

# A stand-in for Verdandi's Claude sidecar (its gRPC service on a unix socket, a replay ring, several
# watchers, the end on stdin's EOF), for the tests that hand a sidecar to another process. Never shipped.
[[bin]]
name = "eitri-sidecar-standin"
path = "tests/support/sidecar_standin.rs"
required-features = ["test-support"]

# A live demo of the legacy `AgentSession`; without the feature it would compile against the stub and
# fail at `start`, so it asks for the feature instead.
[[example]]
name = "demo"
required-features = ["legacy-backend"]

# Tests of the legacy backend alone: skipped without the feature, run by
# `cargo test -p agent --features legacy-backend`. No test is deleted.
[[test]]
name = "agent_hook_binary"
required-features = ["legacy-backend"]

[[test]]
name = "backend_conformance"
required-features = ["legacy-backend"]

[[test]]
name = "environment_conformance"
required-features = ["legacy-backend"]

[[test]]
name = "hook_protocol"
required-features = ["legacy-backend"]

[[test]]
name = "stream_capture_conformance"
required-features = ["legacy-backend"]

[[test]]
name = "wire_translation"
required-features = ["legacy-backend"]

[[test]]
name = "standin_seams"
required-features = ["test-support"]
