[package]
name = "agent"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
claude-runtime-protocol = { git = "https://github.com/HunterGrey-cyber/verdandi.git", rev = "b0f043f31a453cc667e981d5f9e327b6219e442c" }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
sha2 = "0.10"
libc = "0.2"
