<svg id="fixtureflowchart" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 49184px;" viewBox="-8 -8 49184 40" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#fixtureflowchart{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#abcdef;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixtureflowchart .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixtureflowchart .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixtureflowchart .error-icon{fill:hsl(30, 65.3846153846%, 25.3921568627%);}#fixtureflowchart .error-text{fill:rgb(147.9134615387, 190.2500000001, 232.5865384616);stroke:rgb(147.9134615387, 190.2500000001, 232.5865384616);}#fixtureflowchart .edge-thickness-normal{stroke-width:1px;}#fixtureflowchart .edge-thickness-thick{stroke-width:3.5px;}#fixtureflowchart .edge-pattern-solid{stroke-dasharray:0;}#fixtureflowchart .edge-thickness-invisible{stroke-width:0;fill:none;}#fixtureflowchart .edge-pattern-dashed{stroke-dasharray:3;}#fixtureflowchart .edge-pattern-dotted{stroke-dasharray:2;}#fixtureflowchart .marker{fill:#abcdef;stroke:#abcdef;}#fixtureflowchart .marker.cross{stroke:#abcdef;}#fixtureflowchart svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixtureflowchart p{margin:0;}#fixtureflowchart .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#abcdef;}#fixtureflowchart .cluster-label text{fill:rgb(147.9134615387, 190.2500000001, 232.5865384616);}#fixtureflowchart .cluster-label span{color:rgb(147.9134615387, 190.2500000001, 232.5865384616);}#fixtureflowchart .cluster-label span p{background-color:transparent;}#fixtureflowchart .label text,#fixtureflowchart span{fill:#abcdef;color:#abcdef;}#fixtureflowchart .node rect,#fixtureflowchart .node circle,#fixtureflowchart .node ellipse,#fixtureflowchart .node polygon,#fixtureflowchart .node path{fill:#123456;stroke:hsl(210, 25.3846153846%, 10.3921568627%);stroke-width:1px;}#fixtureflowchart .rough-node .label text,#fixtureflowchart .node .label text,#fixtureflowchart .image-shape .label,#fixtureflowchart .icon-shape .label{text-anchor:middle;}#fixtureflowchart .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#fixtureflowchart .rough-node .label,#fixtureflowchart .node .label,#fixtureflowchart .image-shape .label,#fixtureflowchart .icon-shape .label{text-align:center;}#fixtureflowchart .node.clickable{cursor:pointer;}#fixtureflowchart .root .anchor path{fill:#abcdef!important;stroke-width:0;stroke:#abcdef;}#fixtureflowchart .arrowheadPath{fill:#0b0b0b;}#fixtureflowchart .edgePaths .path{stroke:#abcdef;stroke-width:1px;}#fixtureflowchart .flowchart-link{stroke:#abcdef;fill:none;}#fixtureflowchart .edgeLabel{background-color:hsl(90, 65.3846153846%, 20.3921568627%);text-align:center;}#fixtureflowchart .edgeLabel p{background-color:hsl(90, 65.3846153846%, 20.3921568627%);}#fixtureflowchart .edgeLabel rect{opacity:0.5;background-color:hsl(90, 65.3846153846%, 20.3921568627%);fill:hsl(90, 65.3846153846%, 20.3921568627%);}#fixtureflowchart .labelBkg{background-color:rgba(51.9999999999, 85.9999999998, 18, 0.5);}#fixtureflowchart .cluster rect{fill:hsl(30, 65.3846153846%, 25.3921568627%);stroke:hsl(30, 25.3846153846%, 15.3921568627%);stroke-width:1px;}#fixtureflowchart .cluster text{fill:rgb(147.9134615387, 190.2500000001, 232.5865384616);}#fixtureflowchart .cluster span{color:rgb(147.9134615387, 190.2500000001, 232.5865384616);}#fixtureflowchart .node .collapsed-indicator{fill:hsl(30, 25.3846153846%, 15.3921568627%);stroke:none;opacity:0.6;}#fixtureflowchart .node .collapsed-separator{stroke:hsl(30, 25.3846153846%, 15.3921568627%);stroke-width:0.75px;}#fixtureflowchart div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(30, 65.3846153846%, 25.3921568627%);border:1px solid hsl(30, 25.3846153846%, 15.3921568627%);border-radius:2px;pointer-events:none;z-index:100;}#fixtureflowchart .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#abcdef;}#fixtureflowchart rect.text{fill:none;stroke-width:0;}#fixtureflowchart .icon-shape,#fixtureflowchart .image-shape{background-color:hsl(90, 65.3846153846%, 20.3921568627%);text-align:center;}#fixtureflowchart .icon-shape p,#fixtureflowchart .image-shape p{background-color:hsl(90, 65.3846153846%, 20.3921568627%);padding:2px;}#fixtureflowchart .icon-shape .label rect,#fixtureflowchart .image-shape .label rect{opacity:0.5;background-color:hsl(90, 65.3846153846%, 20.3921568627%);fill:hsl(90, 65.3846153846%, 20.3921568627%);}#fixtureflowchart .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#fixtureflowchart .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#fixtureflowchart .node .neo-node{stroke:hsl(210, 25.3846153846%, 10.3921568627%);}#fixtureflowchart [data-look="neo"].node rect,#fixtureflowchart [data-look="neo"].cluster rect,#fixtureflowchart [data-look="neo"].node polygon{stroke:url(#fixtureflowchart-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fixtureflowchart [data-look="neo"].swimlane.cluster rect{filter:none;}#fixtureflowchart [data-look="neo"].node path{stroke:url(#fixtureflowchart-gradient);stroke-width:1px;}#fixtureflowchart [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fixtureflowchart [data-look="neo"].node .neo-line path{stroke:hsl(210, 25.3846153846%, 10.3921568627%);filter:none;}#fixtureflowchart [data-look="neo"].node circle{stroke:url(#fixtureflowchart-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fixtureflowchart [data-look="neo"].node circle .state-start{fill:#000000;}#fixtureflowchart [