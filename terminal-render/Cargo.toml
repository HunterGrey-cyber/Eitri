[package]
name = "terminal-render"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
# Moved from Verdandi (`crates/terminal-render` @ e5f9cc3) into neovibe on 2026-09-23, the owner's decision 4.1(a)
# in docs/superpowers/specs/2026-09-23-bottom-terminal-design.md: neovibe is its only product consumer.
# Verdandi stated no licence for it; it is the owner's own code, MIT with the rest of neovibe from here.
description = "Correctness-first native rendering of TerminalFrame: a pure paint-list builder. Contains NO backend and no graphics dependency by design -- backends live in the consuming frontend."

# terminal-frame is the ONLY dependency, and that is a hard rule: no graphics
# crate, no Skia, no windowing, ever. A backend is the consuming frontend's, and
# keeping one out of here is what lets the whole cell/colour/wide-char/cursor
# contract be tested with no GPU, no window and no Skia build.
[dependencies]
terminal-frame = { path = "../terminal-frame" }

[dev-dependencies]
# Only the TESTS drive a real Term; the library itself never depends on it.
alacritty_terminal = "0.26.0"

[features]
default = []
