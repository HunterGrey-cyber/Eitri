[package]
name = "supervisor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "supervisor"

[[bin]]
name = "neovibe-supervisor"
path = "src/bin/neovibe_supervisor.rs"
required-features = ["gui"]

[features]
# On by default so `cargo build --workspace`, `shell`'s dependency on this crate, and anything a
# developer or CI runs today keeps building `neovibe-supervisor` exactly as before -- this crate
# adds an *option* (`--no-default-features` for a GTK-free lib-only build, needed on macOS, which
# has no GTK), it does not change what a plain `cargo build` produces.
default = ["gui"]
gui = ["dep:gtk4"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk4 = { version = "0.11.4", features = ["v4_14"], optional = true }
