[package]
name = "supervisor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "supervisor"

[[bin]]
name = "neovibe-supervisor"
path = "src/bin/neovibe_supervisor.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk4 = { version = "0.11.4", features = ["v4_18"] }
