name: eitri
arch: amd64
version: ${VERSION}
release: 1
maintainer: Hunter Grey <71165939+HunterGrey-cyber@users.noreply.github.com>
description: |
  Your Neovim, with Claude Code beside it: a readable Claude Code panel next to your own Neovim.
  It runs the Claude Code you installed; Eitri never touches your credentials.
  Source, including this package's own build recipe: ${EITRI_SOURCE_URL}
homepage: https://github.com/HunterGrey-cyber/eitri
# SPDX. The public expression (packaging/nfpm-public.yaml) plus
# LicenseRef-Anthropic-Claude-Agent-SDK: unlike the public profile, this one ships the sidecar
# (decision B, 2026-09-19), so its notice must name the SDK's own licence too (spec sec 8, sec 11).
license: MIT AND Apache-2.0 AND LGPL-3.0-only AND MPL-2.0 AND LicenseRef-Anthropic-Claude-Agent-SDK

# Direct links only -- gtk4 and webkitgtk pull in the other ~100 transitively, and listing those
# would pin versions this package has no opinion about. `neovim` and `claude` are runtime lookups on
# PATH rather than link-time: nvim is a real package, `claude` is not in any distro and is named in
# the description instead of pretended to be resolvable.
#
# `neovim` itself is a top-level (Arch/pacman-default) `depends`, not a `recommends`: nfpm's
# archlinux packager writes `depend` lines only -- no `optdepend` -- so there is no soft-dependency
# spelling to move it to there (the KNOWN LIMIT note below this file already established that for
# the font). The `.deb` moves it to `recommends` instead (D8, spec sec 8): the private mirror's own audience
# is this owner's machines, where a distro `neovim` package satisfying `Depends:` and then being
# too old to run (Ubuntu 24.04 ships 0.9.5, spec sec 2.4) is the failure D8 exists to avoid on
# Debian/Ubuntu hosts specifically; pacman has no such floor problem recorded, so its hard
# `depends` is left as is.
depends:
  - gtk4
  - webkitgtk-6.0
  - neovim
# A soft dependency (nfpm's `recommends` field, mirroring `depends`'s own base+per-packager shape):
# the band's mode pill draws `⏵⏵` (U+23F5), which FiraCode Nerd Font does not carry (`fc-list
# ':charset=23f5'`, 2026-09-26; `index.css`'s `.mode-glyph` falls through several fonts for the same
# reason). Without one of them the band shows the font's `.notdef` box instead of the glyph -- never
# a missing package, so `depends` would be too strong. Verified on this host, 2026-09-26:
# `pacman -Fl noto-fonts | grep Symbols2` -> `usr/share/fonts/noto/NotoSansSymbols2-Regular.ttf`.
# Debian's `fonts-noto-core` (bookworm) checked online the same day, its own file list page:
# `/usr/share/fonts/truetype/noto/NotoSansSymbols2-Regular.ttf`.
#
# KNOWN LIMIT: this reaches the .deb only. nfpm's archlinux packager writes `depend` lines and
# nothing else -- no `optdepend`, and `recommends`/`suggests` are dropped (checked 2026-09-26 by
# building a throwaway package with this host's nfpm: the .deb's control had `Recommends:`, the
# .pkg.tar.zst's `.PKGINFO` had only `depend = bash`). So the pacman package declares no font, and
# on an Arch machine without noto-fonts (or Symbola) the glyph falls to whatever fontconfig picks.
# A hard `depends: noto-fonts` would close it and is left to the owner, since a missing font costs
# one glyph, not a working install.
recommends:
  - noto-fonts # NotoSansSymbols2: the ⏵⏵ mode glyph (spec 2026-09-26 §9)
overrides:
  deb:
    depends:
      - libgtk-4-1
      - libwebkitgtk-6.0-4
    # neovim moved here from `depends` (spec sec 8, D8): Ubuntu 24.04's own neovim is 0.9.5, below
    # the fork's floor of 0.10, so a hard `Depends:` would resolve, install, and then fail at first
    # launch with no useful error (the same reasoning as the public `.deb`, packaging/nfpm-public.yaml).
    recommends:
      - fonts-noto-core
      - neovim

contents:
  # All four must land in ONE directory: each companion is located as a sibling of the running
  # executable (`current_exe()`'s parent). Splitting them produces a build that starts and then
  # silently has no pane switching or supervisor. There were five here and `agent-hook` (legacy's
  # PreToolUse relay); it is gone (D16, spec sec 10) -- no release contains the legacy backend, the
  # private one included, so there is no gate left for it to relay for.
  - src: ./target/release/shell
    dst: /usr/lib/eitri/shell
  - src: ./target/release/eitri-supervisor
    dst: /usr/lib/eitri/eitri-supervisor
  - src: ./target/release/eitri-tmux-shim
    dst: /usr/lib/eitri/eitri-tmux-shim
  - src: ./target/release/eitri-claude-handoff
    dst: /usr/lib/eitri/eitri-claude-handoff

  # The Verdandi sidecar, as a self-contained executable with no Node runtime dependency (its own
  # build bundles one). Installed as a FIFTH sibling, under a versionless name: the artifact's own
  # file name carries its version and architecture, which is right for a download and wrong for an
  # installed path -- encoding it here would make every sidecar upgrade a change to this file. The
  # compatibility statement lives in the handshake (protocol major plus sidecar_version).
  #
  # Its presence is what makes the sidecar the default: `BackendKind::choose` asks whether a shipped
  # artifact sits beside the binary, so nothing here has to be flipped when it starts shipping.
  #
  # `publish.sh` stages it; see that script for where it comes from and why the build refuses rather
  # than quietly producing a package that silently falls back to legacy.
  - src: ./dist/verdandi-claude-sidecar
    dst: /usr/lib/eitri/verdandi-claude-sidecar

  # Which Verdandi revision that sidecar was built from, spelled as the PUBLIC twin rev (the one
  # `EXPECTED_VERDANDI_REVISION` in the extracted `shell` names), not the private rev it was
  # actually built from -- publish.sh asserts the private pin's public export equals this rev before
  # writing the file, so a private-rev mismatch never reaches a package (spec sec 8 step 5). A
  # missing or mismatched `.rev` beside the sidecar sibling is what makes `spawn.rs`'s skew warning
  # fire (spec sec 5.2).
  - src: ./dist/verdandi-claude-sidecar.rev
    dst: /usr/lib/eitri/verdandi-claude-sidecar.rev
    file_info:
      mode: 0644

  - src: ./packaging/eitri.launcher.sh
    dst: /usr/bin/eitri
  # The desktop entry is named by the application id (`cn.huntergrey.eitri`, shell/src/main.rs's
  # APP_ID), the name the compositor matches a window to; it replaced `eitri.desktop`, which an
  # upgrade drops by this package no longer listing it. `Icon=` names the theme icon below.
  - src: ./packaging/cn.huntergrey.eitri.desktop
    dst: /usr/share/applications/cn.huntergrey.eitri.desktop
  # The panel's own entry: `eitri panel` is a second window class, so it gets its own (hidden) entry.
  - src: ./packaging/cn.huntergrey.eitri.Panel.desktop
    dst: /usr/share/applications/cn.huntergrey.eitri.Panel.desktop
  # The nvim plugin that adds :EitriPanel (nvim/eitri.nvim/doc/eitri.txt says how to load it).
  - src: ./nvim/eitri.nvim/plugin/eitri.lua
    dst: /usr/share/eitri/nvim/eitri.nvim/plugin/eitri.lua
    file_info:
      mode: 0644
  - src: ./nvim/eitri.nvim/lua/eitri/init.lua
    dst: /usr/share/eitri/nvim/eitri.nvim/lua/eitri/init.lua
    file_info:
      mode: 0644
  - src: ./nvim/eitri.nvim/doc/eitri.txt
    dst: /usr/share/eitri/nvim/eitri.nvim/doc/eitri.txt
    file_info:
      mode: 0644

  # The icon, in every size packaging/icons/hicolor holds, under the icon theme's own tree
  # (packaging/icons/README.md; its notice, CC BY 4.0, is printed in THIRD-PARTY-LICENSES).
  - src: ./packaging/icons/hicolor/16x16/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/16x16/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/24x24/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/24x24/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/32x32/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/32x32/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/48x48/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/48x48/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/64x64/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/64x64/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/128x128/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/128x128/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/256x256/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/256x256/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/512x512/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/512x512/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/scalable/apps/cn.huntergrey.eitri.svg
    dst: /usr/share/icons/hicolor/scalable/apps/cn.huntergrey.eitri.svg

  # The AppArmor profile Ubuntu 23.10+'s user-namespace restriction needs before WebKit's sandbox
  # can start (packaging/apparmor/eitri; docs/superpowers/plans/2026-09-28-v1-dist-ubuntu-userns.md).
  # The .deb only: no rpm-based distribution restricts user namespaces this way. A conffile
  # (config|noreplace), so a site's edit survives an upgrade, and nothing loads it -- this package has
  # no maintainer scripts: the next restart does, or `sudo apparmor_parser -r /etc/apparmor.d/eitri`,
  # which Eitri itself prints in the agent panel's place until it is loaded.
  - src: ./packaging/apparmor/eitri
    dst: /etc/apparmor.d/eitri
    type: config|noreplace
    packager: deb
    file_info:
      mode: 0644

  # Eitri's own licence, and the notices for everything else in this package. The second file is
  # generated by packaging/collect-licenses.py (publish.sh runs it before packaging and aborts if it
  # fails); nfpm itself fails on a missing src, so a package without it cannot be built. It
  # includes the one part that is not open source -- the Anthropic SDK inside the sidecar -- by
  # name and with its own licence text.
  - src: ./LICENSE
    dst: /usr/share/licenses/eitri/LICENSE
  - src: ./dist/THIRD-PARTY-LICENSES
    dst: /usr/share/licenses/eitri/THIRD-PARTY-LICENSES
  # The LGPL-3.0 sec 4(d)(0) / GPL-3.0 sec 6(d) Corresponding Source notice: these packages ship the
  # public release's own binaries, extracted rather than rebuilt (D2, spec sec 8 step 3), so this is
  # the same `SOURCE` file the public tarball carries, taken from it unmodified (spec sec 8's "extra
  # files" row).
  - src: ./dist/SOURCE
    dst: /usr/share/licenses/eitri/SOURCE

  # What `eitri setup` reads on a private install too (spec sec 6.2, sec 8's "extra files" row):
  # the public release's own manifest, taken from its tarball unmodified. 0644: read, never executed.
  - src: ./dist/RELEASE
    dst: /usr/lib/eitri/RELEASE
    file_info:
      mode: 0644
