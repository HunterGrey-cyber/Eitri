name: eitri
arch: amd64
version: ${VERSION}
release: 1
maintainer: Hunter Grey <71165939+HunterGrey-cyber@users.noreply.github.com>
description: |
  Your Neovim, tiled with your agents, terminals and the web pages you build, in one window.
  It runs the Claude Code you installed; Eitri never touches your credentials.
  Source, including this package's own build recipe: ${EITRI_SOURCE_URL}
homepage: https://github.com/HunterGrey-cyber/eitri
# The SPDX expression adds LicenseRef-Anthropic-Claude-Agent-SDK to the public profile's
# expression: this profile ships the sidecar, so its notice must also name the SDK's licence.
license: MIT AND Apache-2.0 AND LGPL-3.0-only AND MPL-2.0 AND LicenseRef-Anthropic-Claude-Agent-SDK

# Direct links only -- gtk4 and webkitgtk pull in the other ~100 transitively, and listing those
# would pin versions this package has no opinion about. `neovim` and `claude` are runtime lookups on
# PATH rather than link-time: nvim is a real package, `claude` is not in any distro and is named in
# the description instead of pretended to be resolvable.
#
# Arch keeps neovim in depends: nfpm writes depend lines but offers no optdepend spelling.
# The .deb recommends it because Ubuntu 24.04 supplies 0.9.5, below the required 0.10;
# a hard dependency would resolve successfully yet leave Eitri unable to launch.
depends:
  - gtk4
  - webkitgtk-6.0
  - neovim
# The mode pill draws U+23F5, absent from FiraCode Nerd Font (`fc-list ':charset=23f5'`).
# Without a fallback such as NotoSansSymbols2 it shows a .notdef box, so the font is optional.
# `pacman -Fl noto-fonts | grep Symbols2` gives usr/share/fonts/noto/NotoSansSymbols2-Regular.ttf;
# Debian bookworm's fonts-noto-core lists /usr/share/fonts/truetype/noto/NotoSansSymbols2-Regular.ttf.
#
# KNOWN LIMIT: nfpm emits Recommends in .deb control but only depend lines in .PKGINFO;
# recommends/suggests produce no optdepend. The Arch package therefore declares no font and uses
# whatever fontconfig selects. Keep this provisional: a hard font dependency would close the gap,
# but a missing font costs one glyph rather than a working install.
recommends:
  - noto-fonts # NotoSansSymbols2: the ⏵⏵ mode glyph
overrides:
  deb:
    depends:
      - libgtk-4-1
      - libwebkitgtk-6.0-4
    # Recommend neovim because Ubuntu 24.04 ships 0.9.5, below the fork's 0.10 floor:
    # a hard dependency would resolve and install, then fail at launch.
    recommends:
      - fonts-noto-core
      - neovim

contents:
  # All five must land in one directory: companions are found beside current_exe(). Splitting
  # them leaves pane switching or the supervisor unavailable. No agent-hook is needed because
  # release builds exclude the legacy backend whose PreToolUse gate it relays.
  - src: ./target/release/shell
    dst: /usr/lib/eitri/shell
  - src: ./target/release/eitri-supervisor
    dst: /usr/lib/eitri/eitri-supervisor
  - src: ./target/release/eitri-tmux-shim
    dst: /usr/lib/eitri/eitri-tmux-shim
  - src: ./target/release/eitri-run-guard
    dst: /usr/lib/eitri/eitri-run-guard
  - src: ./target/release/eitri-claude-handoff
    dst: /usr/lib/eitri/eitri-claude-handoff

  # The Verdandi sidecar, as a self-contained executable with no Node runtime dependency (its own
  # build bundles one). Installed beside the five binaries above, under a versionless name: the
  # artifact's own file name carries its version and architecture, which is right for a download and wrong for an
  # installed path -- encoding it here would make every sidecar upgrade a change to this file. The
  # compatibility statement lives in the handshake (protocol major plus sidecar_version).
  #
  # The sidecar is the default with or without it: `BackendKind::choose` reads whether a shipped
  # artifact sits beside the binary only to word the hint it prints when none does.
  #
  # `publish.sh` stages it; see that script for where it comes from and why the build refuses rather
  # than producing a package whose Claude tabs fail for want of a sidecar.
  - src: ./dist/verdandi-claude-sidecar
    dst: /usr/lib/eitri/verdandi-claude-sidecar

  # The public twin revision must match EXPECTED_VERDANDI_REVISION in the extracted shell.
  # publish.sh checks that the private pin exports to this revision before writing the file.
  # A missing or mismatched .rev beside the sidecar triggers spawn.rs's skew warning.
  - src: ./dist/verdandi-claude-sidecar.rev
    dst: /usr/lib/eitri/verdandi-claude-sidecar.rev
    file_info:
      mode: 0644

  - src: ./packaging/eitri.launcher.sh
    dst: /usr/bin/eitri
  # The compositor matches the desktop entry by APP_ID, cn.huntergrey.eitri.
  # This package omits eitri.desktop so upgrades drop it; Icon= names the theme icon below.
  - src: ./packaging/cn.huntergrey.eitri.desktop
    dst: /usr/share/applications/cn.huntergrey.eitri.desktop
  # The panel's own entry: `eitri panel` is a second window class, so it gets its own (hidden) entry.
  - src: ./packaging/cn.huntergrey.eitri.Panel.desktop
    dst: /usr/share/applications/cn.huntergrey.eitri.Panel.desktop
  # The nvim plugin that adds :EitriPanel (nvim/eitri.nvim/doc/eitri.txt says how to load it).
  - src: ./nvim/eitri.nvim/plugin/eitri.lua
    dst: /usr/share/eitri/nvim/eitri.nvim/plugin/eitri.lua
    file_info:
      mode: 0644
  - src: ./nvim/eitri.nvim/lua/eitri/init.lua
    dst: /usr/share/eitri/nvim/eitri.nvim/lua/eitri/init.lua
    file_info:
      mode: 0644
  - src: ./nvim/eitri.nvim/doc/eitri.txt
    dst: /usr/share/eitri/nvim/eitri.nvim/doc/eitri.txt
    file_info:
      mode: 0644
  # The GNOME Shell extension a companion panel on GNOME uses to move focus to and from its editor. Only the four
  # files the shell loads: testing.js and test/ are test code and stay out of the package.
  - src: ./gnome-extension/metadata.json
    dst: /usr/share/gnome-shell/extensions/eitri@huntergrey.cn/metadata.json
    file_info:
      mode: 0644
  - src: ./gnome-extension/extension.js
    dst: /usr/share/gnome-shell/extensions/eitri@huntergrey.cn/extension.js
    file_info:
      mode: 0644
  - src: ./gnome-extension/direction.js
    dst: /usr/share/gnome-shell/extensions/eitri@huntergrey.cn/direction.js
    file_info:
      mode: 0644
  - src: ./gnome-extension/policy.js
    dst: /usr/share/gnome-shell/extensions/eitri@huntergrey.cn/policy.js
    file_info:
      mode: 0644

  # The Markdown preview plugin, a plugin directory `eitri.plugin.load("markdown")` finds under the system data
  # directories: its manifest and its built site, staged by release.sh as one tree (ctr_stage_plugins), so this
  # entry never lists the site's files.
  - src: ./plugins/markdown
    dst: /usr/share/eitri/plugins/markdown
    type: tree

  # Install every size in packaging/icons/hicolor under the icon theme's tree.
  # The CC BY 4.0 notice is printed in THIRD-PARTY-LICENSES.
  - src: ./packaging/icons/hicolor/16x16/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/16x16/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/24x24/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/24x24/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/32x32/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/32x32/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/48x48/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/48x48/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/64x64/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/64x64/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/128x128/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/128x128/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/256x256/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/256x256/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/512x512/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/512x512/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/scalable/apps/cn.huntergrey.eitri.svg
    dst: /usr/share/icons/hicolor/scalable/apps/cn.huntergrey.eitri.svg

  # Ubuntu 23.10+'s user-namespace restriction needs this AppArmor profile for WebKit's sandbox.
  # Ship it in .deb only; rpm distributions do not impose this restriction. config|noreplace
  # preserves local edits. There are no maintainer scripts to load it: restart, or run
  # `sudo apparmor_parser -r /etc/apparmor.d/eitri`, as the agent panel instructs.
  - src: ./packaging/apparmor/eitri
    dst: /etc/apparmor.d/eitri
    type: config|noreplace
    packager: deb
    file_info:
      mode: 0644

  # Eitri's own licence and acknowledgement, and the notices for everything else in this package. The
  # third file is generated by packaging/collect-licenses.py (publish.sh runs it before packaging and aborts if it
  # fails); nfpm itself fails on a missing src, so a package without it cannot be built. It
  # includes the one part that is not open source -- the Anthropic SDK inside the sidecar -- by
  # name and with its own licence text.
  - src: ./LICENSE
    dst: /usr/share/licenses/eitri/LICENSE
  - src: ./NOTICE
    dst: /usr/share/licenses/eitri/NOTICE
  - src: ./dist/THIRD-PARTY-LICENSES
    dst: /usr/share/licenses/eitri/THIRD-PARTY-LICENSES
  # LGPL-3.0 4(d)(0) / GPL-3.0 6(d) require the Corresponding Source notice. These packages
  # extract the public release's binaries, so carry its tarball's SOURCE file unmodified.
  - src: ./dist/SOURCE
    dst: /usr/share/licenses/eitri/SOURCE

  # eitri setup reads the public release's manifest on private installs too.
  # Take it from the tarball unmodified; mode 0644 permits reading, never execution.
  - src: ./dist/RELEASE
    dst: /usr/lib/eitri/RELEASE
    file_info:
      mode: 0644
