name: eitri
arch: amd64
version: ${VERSION}
release: 1
version_schema: semver
maintainer: Hunter Grey <71165939+HunterGrey-cyber@users.noreply.github.com>
description: |
  Your Neovim, tiled with your agents, terminals and the web pages you build.
  It runs the Claude Code you installed; run `eitri setup` after installing to build the agent
  backend (it downloads and builds Anthropic's Agent SDK on your own machine -- the SDK is not
  ours to redistribute, so this package never contains it).
  Source, including this package's own build recipe: ${EITRI_SOURCE_URL}
homepage: https://github.com/HunterGrey-cyber/eitri
# The licence expression covers this package (the tarball's five binaries, statically linking
# nvim-rs LGPL-3.0-only) plus the MIT/Apache-2.0/MPL-2.0 licences the collector finds. No
# LicenseRef-Anthropic-Claude-Agent-SDK here: this profile never carries the sidecar.
license: MIT AND Apache-2.0 AND LGPL-3.0-only AND MPL-2.0

# The public release is built in Ubuntu 24.04. It ships no sidecar or legacy agent-hook and has
# no maintainer scripts: a postinst would build the sidecar as root.
# packaging/test_nfpm_profiles.py checks the permitted differences from packaging/nfpm.yaml.
#
# Do not depend on neovim: Ubuntu 24.04's 0.9.5 satisfies the package name but cannot run the
# editor, which requires at least 0.10. Fedora gets a soft recommendation; Arch's AUR packages
# use optdepends so bob and self-built nvim installations remain usable.
#
# Only deb and rpm are produced here; Arch uses the AUR recipes. Keep all dependency lists in
# overrides so neither packager's result depends on whether nfpm replaces or extends defaults.
overrides:
  deb:
    depends:
      - libgtk-4-1 (>= 4.14)
      - libwebkitgtk-6.0-4
  rpm:
    depends:
      - gtk4 >= 4.14
      - webkitgtk6.0
    recommends:
      - neovim

contents:
  # No agent-hook: releases never compile the legacy backend it would relay for.
  - src: ./target/release/shell
    dst: /usr/lib/eitri/shell
  - src: ./target/release/eitri-supervisor
    dst: /usr/lib/eitri/eitri-supervisor
  - src: ./target/release/eitri-tmux-shim
    dst: /usr/lib/eitri/eitri-tmux-shim
  - src: ./target/release/eitri-run-guard
    dst: /usr/lib/eitri/eitri-run-guard
  - src: ./target/release/eitri-claude-handoff
    dst: /usr/lib/eitri/eitri-claude-handoff

  # Use the tracked installer directly: the setup copy must be byte-identical to install.sh,
  # which release.sh checks before packaging.
  - src: ./packaging/install.sh
    dst: /usr/lib/eitri/eitri-setup
    file_info:
      mode: 0755

  # What `eitri setup` (and the launcher's pre-flight hint) reads to know which sidecar
  # revision, Node pin and nvim pin this install expects. 0644: it is
  # read, never executed.
  - src: ./dist/RELEASE
    dst: /usr/lib/eitri/RELEASE
    file_info:
      mode: 0644

  - src: ./packaging/eitri.launcher.sh
    dst: /usr/bin/eitri
  # Match the application id from shell/src/main.rs so the compositor associates the window
  # with this entry. An upgrade drops the unlisted eitri.desktop; Icon= names the theme icon below.
  - src: ./packaging/cn.huntergrey.eitri.desktop
    dst: /usr/share/applications/cn.huntergrey.eitri.desktop
  # The panel's own entry: `eitri panel` is a second window class, so it gets its own (hidden) entry.
  - src: ./packaging/cn.huntergrey.eitri.Panel.desktop
    dst: /usr/share/applications/cn.huntergrey.eitri.Panel.desktop
  # The page window's entry: a web page opened as a window of its own is a third window class (hidden likewise).
  - src: ./packaging/cn.huntergrey.eitri.Page.desktop
    dst: /usr/share/applications/cn.huntergrey.eitri.Page.desktop
  # The nvim plugin that adds :EitriPanel (nvim/eitri.nvim/doc/eitri.txt says how to load it).
  - src: ./nvim/eitri.nvim/plugin/eitri.lua
    dst: /usr/share/eitri/nvim/eitri.nvim/plugin/eitri.lua
    file_info:
      mode: 0644
  - src: ./nvim/eitri.nvim/lua/eitri/init.lua
    dst: /usr/share/eitri/nvim/eitri.nvim/lua/eitri/init.lua
    file_info:
      mode: 0644
  - src: ./nvim/eitri.nvim/doc/eitri.txt
    dst: /usr/share/eitri/nvim/eitri.nvim/doc/eitri.txt
    file_info:
      mode: 0644
  # The GNOME Shell extension a companion panel on GNOME uses to move focus to and from its editor. Only the four
  # files the shell loads: testing.js and test/ are test code and stay out of the package.
  - src: ./gnome-extension/metadata.json
    dst: /usr/share/gnome-shell/extensions/eitri@huntergrey.cn/metadata.json
    file_info:
      mode: 0644
  - src: ./gnome-extension/extension.js
    dst: /usr/share/gnome-shell/extensions/eitri@huntergrey.cn/extension.js
    file_info:
      mode: 0644
  - src: ./gnome-extension/direction.js
    dst: /usr/share/gnome-shell/extensions/eitri@huntergrey.cn/direction.js
    file_info:
      mode: 0644
  - src: ./gnome-extension/policy.js
    dst: /usr/share/gnome-shell/extensions/eitri@huntergrey.cn/policy.js
    file_info:
      mode: 0644

  # The Markdown preview plugin, a plugin directory `eitri.plugin.load("markdown")` finds under the system data
  # directories: its manifest and its built site, staged by release.sh as one tree (ctr_stage_plugins), so this
  # entry never lists the site's files.
  - src: ./plugins/markdown
    dst: /usr/share/eitri/plugins/markdown
    type: tree

  # The icon, in every size packaging/icons/hicolor holds, under the icon theme's own tree
  # (packaging/icons/README.md; its notice, CC BY 4.0, is printed in THIRD-PARTY-LICENSES).
  - src: ./packaging/icons/hicolor/16x16/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/16x16/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/24x24/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/24x24/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/32x32/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/32x32/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/48x48/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/48x48/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/64x64/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/64x64/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/128x128/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/128x128/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/256x256/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/256x256/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/512x512/apps/cn.huntergrey.eitri.png
    dst: /usr/share/icons/hicolor/512x512/apps/cn.huntergrey.eitri.png
  - src: ./packaging/icons/hicolor/scalable/apps/cn.huntergrey.eitri.svg
    dst: /usr/share/icons/hicolor/scalable/apps/cn.huntergrey.eitri.svg

  # The AppArmor profile Ubuntu 23.10+'s user-namespace restriction needs before WebKit's sandbox
  # can start (packaging/apparmor/eitri).
  # The .deb only: no rpm-based distribution restricts user namespaces this way. A conffile
  # (config|noreplace), so a site's edit survives an upgrade, and nothing loads it -- this package has
  # no maintainer scripts: the next restart does, or `sudo apparmor_parser -r /etc/apparmor.d/eitri`,
  # which Eitri itself prints in the agent panel's place until it is loaded.
  - src: ./packaging/apparmor/eitri
    dst: /etc/apparmor.d/eitri
    type: config|noreplace
    packager: deb
    file_info:
      mode: 0644

  # Eitri's own licence and acknowledgement, the notices for everything else this package links or
  # bundles (packaging/collect-licenses.py --no-sidecar), and the LGPL-3.0 sec 4(d)(0) /
  # GPL-3.0 sec 6(d) Corresponding Source notice naming the source asset and the exact relink
  # recipe. All four are the public release's own files (release.sh writes them before staging
  # this package), so this profile never regenerates them itself.
  - src: ./LICENSE
    dst: /usr/share/licenses/eitri/LICENSE
  - src: ./NOTICE
    dst: /usr/share/licenses/eitri/NOTICE
  - src: ./dist/THIRD-PARTY-LICENSES
    dst: /usr/share/licenses/eitri/THIRD-PARTY-LICENSES
  - src: ./dist/SOURCE
    dst: /usr/share/licenses/eitri/SOURCE
