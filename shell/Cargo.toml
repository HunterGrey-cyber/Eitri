[package]
name = "shell"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
neovide-editor = { path = "../neovide-editor" }
agent = { path = "../agent" }
gtk4 = { version = "0.11.4", features = ["v4_18"] }
webkit6 = "0.6"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
