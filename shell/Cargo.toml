[package]
name = "shell"
version.workspace = true
edition.workspace = true
publish.workspace = true
# The package also builds `eitri-tmux-shim`; without this, `cargo run -p shell` cannot tell which
# binary is the product and refuses to start.
default-run = "shell"

[build-dependencies]
# build_web.rs's fingerprint over agent-ui/web's build inputs. Already
# resolved in Cargo.lock as an ordinary dependency of `agent` (sha2 0.10.9), so this adds no new
# crate to fetch -- only a new edge from `shell`'s own build script to a version cargo already has.
sha2 = "0.10"

[dependencies]
neovide-editor = { path = "../neovide-editor" }
agent = { path = "../agent" }
eitri-core = { path = "../core" }
eitri-remote = { path = "../remote" }
eitri-panel = { path = "../panel" }
gtk4 = { version = "0.11.4", features = ["v4_14"] }
webkit6 = "0.6"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# The bottom terminal. The engine
# is GTK-free; `src/terminal/` is its GTK half.
eitri-terminal = { path = "../terminal/engine" }
terminal-input = { path = "../terminal/input" }
terminal-render = { path = "../terminal/render" }
# The terminal's GtkGLArea paints through Skia's GL backend, exactly as neovide-editor's does; same
# version and features, so no second Skia build.
skia-safe = { version = "0.156.0", features = ["gl"] }
libloading = "0.9.0"
# Wakes the GTK main loop from the terminal's session thread (`glib::spawn_future_local` awaits the
# receiver). Already in the graph through glib/gio at this version. Floor is 0.3.32, not 0.3: that's
# where `UnboundedReceiver::recv` (used in terminal/pane.rs) was added -- 0.3.31 has no such method
# (checked against both versions' sources in the local registry
# cache). The lockfile happened to pin 0.3.34, which is why this only mattered on paper before now.
futures-channel = "0.3.32"
# `geteuid`, for the address check of `eitri panel --nvim` (the control socket's own peer check uses
# it too), the peer check of `eitri-editor-bridge`, and `prctl(PR_SET_PDEATHSIG)`/`kill` by captured
# pid in `tests/support/own_x_server.rs`.
# The version `neovide-editor` already depends on directly.
libc = "0.2"
# The arguments of `nvim_exec_lua` (`companion::link`). The version `eitri-core` and the fork share.
rmpv = "1"

[features]
# The development-only legacy backend (`EITRI_AGENT_BACKEND=legacy`, the sandbox GUI passes' stand-in
# that spends nothing), off by default so that no plain `cargo build` -- a release's, the AUR's, a
# README reader's -- contains it. Ask for it with
# `cargo run -p shell --features shell/legacy-backend`; `agent` holds every `cfg`.
legacy-backend = ["eitri-core/legacy-backend", "eitri-panel/legacy-backend"]
# The grid probe (`src/grid_probe/`): a mode of the product binary that runs scripted operations on the
# real module grid inside the sandbox and logs what the hosts do. Never in a release or a default build.
probe = []
editor-fault-injection = ["neovide-editor/fault-injection"]

[dev-dependencies]
# `tests/web_bundle_freshness.rs` `include!`s `build_web.rs` (the way `build_info_lockfile_parsing.rs`
# already includes `build_info_lockfile.rs`), which needs sha2 in its own compilation graph too --
# `[build-dependencies]` above covers only the actual build script, not a `tests/` target. Same crate,
# same already-resolved version; this adds no new dependency edge cargo has to fetch.
sha2 = "0.10"
# Only to name a `TermMode` in a test: `terminal/keys.rs` checks a bare modifier's kitty code through
# the real `terminal_input::encode`, which takes one (GUI pass 2026-09-23, defect 2). The version the
# terminal crates already resolve, so it adds no crate to the graph and ships in no binary.
alacritty_terminal = "0.26.0"
# `eitri_core::test_providers::RecordingProvider`, for the agent panel's per-tab routing tests
# (the session tabs). Tests only: the normal dependency above stays feature-free.
eitri-core = { path = "../core", features = ["test-support"] }
# `tests/end_signals.rs` needs only GLib's main context, no display: it names the crate directly so the
# display-guard scan (`tests/own_display_scan.rs`) does not read it as opening one. The version gtk4
# 0.11.4 already resolves, so it adds no crate to the graph and ships in no binary.
glib = "0.22"
# `AgentPanelHandle::for_host_test`, for counting how often the panel's own loop wakes. Tests only.
eitri-panel = { path = "../panel", features = ["test-support"] }
# The remote audit log's test overrides (a journal socket of the test's own, a short idle deadline) for
# `tests/remote_serve.rs` and the product binary it starts; a dev-dependency only, so no shipped build has them.
eitri-remote = { path = "../remote", features = ["remote-test-hooks"] }
# Only for `tests/nvim_bin_override.rs`: that test drives a real,
# headless `LiveHarness` directly, which needs the fork crate itself, not just `neovide-editor`'s
# wrapper around it. Same rev as `neovide-editor/Cargo.toml`'s own (non-dev) dependency -- Cargo
# already resolved this exact commit for that crate, so this adds no second build, only visibility
# from this crate's own test code.
neovide = { path = "../neovide" }

# Guards the GTK 4.14 / WebKit 2.40 toolkit floor: a plain #[test] harness (unlike the three below), added explicitly so its presence in
# `cargo test`'s default run is visible in this file rather than only in tests/'s directory listing.
[[test]]
name = "toolkit_floor"

# Guards the web bundle's rebuild-when-any-input-changed rule: a plain
# #[test] harness, added explicitly for the same reason `toolkit_floor` is above.
[[test]]
name = "web_bundle_freshness"

# A termination signal reaches the window's handler instead of ending the process (`src/end_signals.rs`): a plain
# #[test] harness that opens no display, in its own binary because it signals its own process.
[[test]]
name = "end_signals"

# The shell only carries out controller decisions; these source scans run without a display.
[[test]]
name = "core_wm_acceptance"

# `eitri --sidecar-probe <path>` answers before anything that could start GTK. A plain `main`, because
# `own_display_scan` requires a test that starts the product binary to isolate its display in `main`, which
# libtest's harness never runs; the child itself is given no display.
[[test]]
name = "sidecar_probe"
harness = false

# `eitri page` beside a real nvim, end to end: a plain `main`, because `own_display_scan` requires a test that starts
# the product binary to isolate its display in `main`. Opt-in with `-- --ignored` (nvim, Xvfb, WebKitGTK).
[[test]]
name = "page_window_start"
harness = false

# `eitri open` over a real nvim in a private tmux, end to end, on the test's own Xvfb: a plain `main`, as every test
# that starts the product binary isolates its display there. Opt-in with `-- --ignored` (nvim 0.12, tmux, Xvfb,
# xdotool, WebKitGTK).
[[test]]
name = "takeover_start"
harness = false

# `:connect` typed in a window's own editor, followed, and the window's close after it: a real nvim, a window on the
# test's own Xvfb, xdotool.
[[test]]
name = "followed_connect"
harness = false

# The binary's `started` line on a detached start's descriptor; a plain `main` that runs it on the test's own Xvfb.
[[test]]
name = "launch_started_line"
harness = false

# Guards the rule that every test opening a display starts its own
# display (2026-09-29): reads `tests/` here and in `neovide-editor` as text, and fails on a file that
# opens a display without `tests/support/own_x_server.rs`. A plain #[test] harness that opens nothing,
# in the default run for the same reason `toolkit_floor` is above: the merge that brings in the next
# unguarded test must turn red, not wait for someone to run it under `--ignored`.
[[test]]
name = "own_display_scan"

# The panel keeps a streaming reply where the reader put it, in the real WebKitGTK (2026-09-24).
# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. Since 2026-09-29 it
# starts its own 1920x1200 `Xvfb` (`tests/support/own_x_server.rs`) and ignores any inherited display,
# so no wrapper is needed and none can be forgotten. See the file's own header.
[[test]]
name = "panel_stream_scroll"
harness = false

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. Starts its own
# `Xvfb` (`tests/support/own_x_server.rs`, 2026-09-29; see the file's header). Holds the GUI
# pass's colorscheme case: a colorscheme change reaching a widget that first shows after it.
[[test]]
name = "hidden_widget_restyle"
harness = false

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. Starts its own
# `Xvfb` (`tests/support/own_x_server.rs`, 2026-09-29; see the file's header). Holds the integration
# GUI pass's finding (2026-09-26):
# the y/n prompt placed as if it had no height, half below the top bar.
[[test]]
name = "close_prompt_placement"
harness = false

# GTK owns the main thread; the pixel checks run only on their own Xvfb with `-- --ignored`.
[[test]]
name = "editor_hole_pixels"
harness = false

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. Starts its own
# `Xvfb` (`tests/support/own_x_server.rs`, 2026-09-29; see the file's header). Holds the v1-scale GUI
# pass's defect A (2026-09-27): the
# band one editor row high in GTK logical px while WebKitGTK zooms the page for `gtk-xft-dpi`.
[[test]]
name = "band_xft_zoom"
harness = false

# A plain `main`, because winit builds its event loop on the main thread only, and libtest runs each
# test on a thread of its own (as `neovide-editor`'s own ignored `LiveHarness` tests are). Needs `nvim`
# (>= 0.11) on `PATH` and a display for winit's clipboard (no window is ever shown) -- since 2026-09-29
# its own `Xvfb` (`tests/support/own_x_server.rs`), never the session's. Proves the pinned fork
# honours `NEOVIM_BIN`: see the file's own header.
[[test]]
name = "nvim_bin_override"
harness = false

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. It starts an
# `Xvfb` of its own (`tests/support/own_x_server.rs`, shared since 2026-09-29) and refuses any other
# display, since it sends real keys and clicks and writes the clipboard (see the file's header; needs
# `Xvfb` and `xdotool`). BROWSE visual mode, driven against the real
# WebKitGTK `Selection.modify` jsdom does not have.
[[test]]
name = "panel_visual_mode"
harness = false

# A plain `main`, opt-in with `-- --ignored`. Holds `tests/support/own_x_server.rs` to its one
# property: a client of the display it hands out reaches that `Xvfb` or nothing, never another
# server's socket file -- using an isolated network namespace and shared `/tmp` with a
# stand-in for the desktop's `/tmp/.X11-unix/X0` (2026-09-29). It builds that namespace
# itself: it re-executes under `bwrap` with a fresh `/tmp` holding a random-token
# marker, a fresh `/run/user/<uid>` and `--unshare-net`, and refuses only where `bwrap` is missing or
# the marker is not there -- so it needs no wrapper of its own. Needs `Xvfb` and `bwrap`.
[[test]]
name = "own_display_guard"
harness = false

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. Starts its own
# `Xvfb` (`tests/support/own_x_server.rs`, since 2026-09-29;
# see the file's header). Holds the 2026-09-29 IME fix: a web module's `WebView` at (0,0) of its
# `WebHost`, so the position WebKitGTK adds to the input method's caret rectangle is zero.
[[test]]
name = "web_host_origin"
harness = false

# A plugin page in the real WebKitGTK: scheme, CSP floor, navigation lock and the bridge through a real
# `PluginHost`. A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. Starts its own
# `Xvfb` (`tests/support/own_x_server.rs`) and refuses any other display.
[[test]]
name = "plugin_page"
harness = false

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. It starts an `Xvfb`
# of its own (`tests/support/own_x_server.rs`) and refuses any other display, since it sends real keys
# (see the file's header; needs `Xvfb` and `xdotool`). The agent panel's `j`/`k` over rows of very
# different heights, measured in the real WebKitGTK at two view heights and two zoom levels.
[[test]]
name = "panel_jk_scroll"
harness = false

# A held `j`/`k` measured frame by frame against the real WebKitGTK page (its own Xvfb, keys through
# XTEST with the server's own auto-repeat). A plain `main` for the same reason as `panel_jk_scroll`.
[[test]]
name = "panel_jk_hold"
harness = false

# A held `j`/`k` on a plugin page (the keyboard kit on a long plain page), measured frame by frame the same
# way: its own Xvfb, keys through XTEST with the server's own auto-repeat. A plain `main` for the same reason.
[[test]]
name = "plugin_page_jk_hold"
harness = false

# The GNOME Shell extension's caller against a private `dbus-daemon` and a fake of the extension. A
# plain `main` so that `own_x_server::isolate` runs first (the guard asks it of every file that names
# a GTK crate); it never opens a window.
[[test]]
name = "gnome_shell_bus"
harness = false

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. Starts its own
# `Xvfb` (`tests/support/own_x_server.rs`; see the file's header). The GTK host of the window contract
# (`src/gtk_host/`) passes the contract's conformance scripts in a real window: the signals GTK emits
# while an op runs are reported while it applies, and only a close from outside asks the sink.
[[test]]
name = "gtk_host_conformance"
harness = false

# GTK owns the main thread; this opt-in test starts its own isolated Xvfb.
[[test]]
name = "command_accels"
harness = false

# The grid's line for a host's unrealize, loud unless the window is closing, in real GTK (`src/module_grid/unrealize.rs`).
# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`, on its own Xvfb
# (`tests/support/own_x_server.rs`).
[[test]]
name = "grid_unrealize_line"
harness = false

# GTK owns the main thread; the opt-in placement checks use their own isolated Xvfb.
[[test]]
name = "project_chooser_placement"
harness = false

# `eitri remote serve` end to end, and its sandbox in children of the test: a plain `main`, because
# `own_display_scan` requires a test that starts the product binary to isolate its display in `main`, and the
# sandbox can only be set up by a process with one thread, which a child the test starts itself is. No display is
# opened; the children get none.
[[test]]
name = "remote_serve"
harness = false

# Remote control switched on end to end: windows decide and start `serve` as a window does, the product binary runs it
# sandboxed in a home of its own, and a headless phone enrolls, watches, interrupts and is closed by `eitri remote stop`.
# `own_display_scan` requires a test that starts the product binary to isolate its display in `main`.
[[test]]
name = "remote_e2e"
harness = false

# The remote audit trail end to end: a window and `serve` write the log and the journal copy, a headless phone drives
# every command and refusal it can reach, and `eitri remote log --verify` is clean, then names each tampering.
# `own_display_scan` requires a test that starts the product binary to isolate its display in `main`.
[[test]]
name = "remote_audit_e2e"
harness = false
