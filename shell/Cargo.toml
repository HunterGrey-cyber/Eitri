[package]
name = "shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
# build_web.rs's fingerprint over agent-ui/web's build inputs (v1-dist plan Task 6, P4-A1). Already
# resolved in Cargo.lock as an ordinary dependency of `agent` (sha2 0.10.9), so this adds no new
# crate to fetch -- only a new edge from `shell`'s own build script to a version cargo already has.
sha2 = "0.10"

[dependencies]
neovide-editor = { path = "../neovide-editor" }
agent = { path = "../agent" }
eitri-core = { path = "../core" }
supervisor = { path = "../supervisor" }
gtk4 = { version = "0.11.4", features = ["v4_14"] }
webkit6 = "0.6"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# The bottom terminal (spec docs/superpowers/specs/2026-09-23-bottom-terminal-design.md). The engine
# is GTK-free; `src/terminal/` is its GTK half.
eitri-terminal = { path = "../terminal" }
terminal-input = { path = "../terminal-input" }
terminal-render = { path = "../terminal-render" }
# The terminal's GtkGLArea paints through Skia's GL backend, exactly as neovide-editor's does; same
# version and features, so no second Skia build.
skia-safe = { version = "0.153.3", features = ["gl"] }
libloading = "0.9.0"
# Wakes the GTK main loop from the terminal's session thread (`glib::spawn_future_local` awaits the
# receiver). Already in the graph through glib/gio at this version. Floor is 0.3.32, not 0.3: that's
# where `UnboundedReceiver::recv` (used in terminal/pane.rs) was added -- 0.3.31 has no such method
# (fix round 1, review finding 2; checked against both versions' sources in the local registry
# cache). The lockfile happened to pin 0.3.34, which is why this only mattered on paper before now.
futures-channel = "0.3.32"

[features]
# The development-only legacy backend (`EITRI_AGENT_BACKEND=legacy`, the sandbox GUI passes' stand-in
# that spends nothing), off by default so that no plain `cargo build` -- a release's, the AUR's, a
# README reader's -- contains it (spec 2026-09-27-v1-dist-design.md §10, D16). Ask for it with
# `cargo run -p shell --features shell/legacy-backend`; `agent` holds every `cfg`.
legacy-backend = ["eitri-core/legacy-backend"]

[dev-dependencies]
# `tests/web_bundle_freshness.rs` `include!`s `build_web.rs` (the way `build_info_lockfile_parsing.rs`
# already includes `build_info_lockfile.rs`), which needs sha2 in its own compilation graph too --
# `[build-dependencies]` above covers only the actual build script, not a `tests/` target. Same crate,
# same already-resolved version; this adds no new dependency edge cargo has to fetch.
sha2 = "0.10"
# Only to name a `TermMode` in a test: `terminal/keys.rs` checks a bare modifier's kitty code through
# the real `terminal_input::encode`, which takes one (GUI pass 2026-09-23, defect 2). The version the
# terminal crates already resolve, so it adds no crate to the graph and ships in no binary.
alacritty_terminal = "0.26.0"
# `eitri_core::test_providers::RecordingProvider`, for the agent panel's per-tab routing tests
# (session tabs plan, Task 6). Tests only: the normal dependency above stays feature-free.
eitri-core = { path = "../core", features = ["test-support"] }
# Only for `tests/nvim_bin_override.rs` (v1-dist plan Task 6, spec §7): that test drives a real,
# headless `LiveHarness` directly, which needs the fork crate itself, not just `neovide-editor`'s
# wrapper around it. Same rev as `neovide-editor/Cargo.toml`'s own (non-dev) dependency -- Cargo
# already resolved this exact commit for that crate, so this adds no second build, only visibility
# from this crate's own test code.
neovide = { path = "../neovide" }
# Only for `tests/support/own_x_server.rs` (2026-09-29): `prctl(PR_SET_PDEATHSIG)` on the `Xvfb` a
# display-opening test starts, and `kill` by its captured pid. The version `neovide-editor` already
# depends on directly, so this adds no crate to the graph and ships in no binary.
libc = "0.2"

# Guards the GTK 4.14 / WebKit 2.40 toolkit floor (spec 2026-09-27-v1-dist-design.md §2.2, plan
# Task 2): a plain #[test] harness (unlike the three below), added explicitly so its presence in
# `cargo test`'s default run is visible in this file rather than only in tests/'s directory listing.
[[test]]
name = "toolkit_floor"

# Guards the web bundle's rebuild-when-any-input-changed rule (v1-dist plan Task 6, P4-A1): a plain
# #[test] harness, added explicitly for the same reason `toolkit_floor` is above.
[[test]]
name = "web_bundle_freshness"

# Guards the rule that every test opening a display starts its own (fix round 3 of GUI tests' own
# display, 2026-09-29): reads `tests/` here and in `neovide-editor` as text, and fails on a file that
# opens a display without `tests/support/own_x_server.rs`. A plain #[test] harness that opens nothing,
# in the default run for the same reason `toolkit_floor` is above: the merge that brings in the next
# unguarded test must turn red, not wait for someone to run it under `--ignored`.
[[test]]
name = "own_display_scan"

# The panel keeps a streaming reply where the reader put it, in the real WebKitGTK (2026-09-24).
# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. Since 2026-09-29 it
# starts its own 1920x1200 `Xvfb` (`tests/support/own_x_server.rs`) and ignores any inherited display,
# so no wrapper is needed and none can be forgotten. See the file's own header.
[[test]]
name = "panel_stream_scroll"
harness = false

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. Starts its own
# `Xvfb` (`tests/support/own_x_server.rs`, 2026-09-29; see the file's header). Holds the GUI
# pass's D1 (2026-09-24): a colorscheme change reaching a widget that first shows after it.
[[test]]
name = "hidden_widget_restyle"
harness = false

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. Starts its own
# `Xvfb` (`tests/support/own_x_server.rs`, 2026-09-29; see the file's header). Holds the integration
# GUI pass's finding (2026-09-26):
# the y/n prompt placed as if it had no height, half below the top bar.
[[test]]
name = "close_prompt_placement"
harness = false

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. Starts its own
# `Xvfb` (`tests/support/own_x_server.rs`, 2026-09-29; see the file's header). Holds the v1-scale GUI
# pass's defect A (2026-09-27): the
# band one editor row high in GTK logical px while WebKitGTK zooms the page for `gtk-xft-dpi`.
[[test]]
name = "band_xft_zoom"
harness = false

# A plain `main`, because winit allows one `EventLoop` per process, on the main thread only (the
# same reason `neovide-editor`'s own ignored `LiveHarness` tests are `harness = false`). Needs `nvim`
# (>= 0.10) on `PATH` and a display for winit's clipboard (no window is ever shown) -- since 2026-09-29
# its own `Xvfb` (`tests/support/own_x_server.rs`), never the session's. Proves the pinned fork
# honours `NEOVIM_BIN` (v1-dist plan Task 6, spec §7): see the file's own header.
[[test]]
name = "nvim_bin_override"
harness = false

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. It starts an
# `Xvfb` of its own (`tests/support/own_x_server.rs`, shared since 2026-09-29) and refuses any other
# display, since it sends real keys and clicks and writes the clipboard (see the file's header; needs
# `Xvfb` and `xdotool`). BROWSE visual mode (spec
# docs/superpowers/specs/2026-09-28-browse-visual-mode-design.md), driven against the real
# WebKitGTK `Selection.modify` jsdom does not have.
[[test]]
name = "panel_visual_mode"
harness = false

# A plain `main`, opt-in with `-- --ignored`. Holds `tests/support/own_x_server.rs` to its one
# property: a client of the display it hands out reaches that `Xvfb` or nothing, never another
# server's socket file -- recreating incident 2's shell (own network namespace, shared `/tmp`) with a
# stand-in for the desktop's `/tmp/.X11-unix/X0` (2026-09-29, fix round 1). It builds that namespace
# itself (fix round 2): it re-executes under `bwrap` with a fresh `/tmp` holding a random-token
# marker, a fresh `/run/user/<uid>` and `--unshare-net`, and refuses only where `bwrap` is missing or
# the marker is not there -- so it needs no wrapper of its own. Needs `Xvfb` and `bwrap`.
[[test]]
name = "own_display_guard"
harness = false

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored`. Starts its own
# `Xvfb` (`tests/support/own_x_server.rs`, since fix round 3 of GUI tests' own display, 2026-09-29;
# see the file's header). Holds the 2026-09-29 IME fix: a web module's `WebView` at (0,0) of its
# `WebHost`, so the position WebKitGTK adds to the input method's caret rectangle is zero.
[[test]]
name = "web_host_origin"
harness = false
