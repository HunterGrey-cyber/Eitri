[package]
name = "shell"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
neovide-editor = { path = "../neovide-editor" }
agent = { path = "../agent" }
neovibe-core = { path = "../core" }
supervisor = { path = "../supervisor" }
gtk4 = { version = "0.11.4", features = ["v4_18"] }
webkit6 = "0.6"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# The bottom terminal (spec docs/superpowers/specs/2026-09-23-bottom-terminal-design.md). The engine
# is GTK-free; `src/terminal/` is its GTK half.
neovibe-terminal = { path = "../terminal" }
terminal-input = { path = "../terminal-input" }
terminal-render = { path = "../terminal-render" }
# The terminal's GtkGLArea paints through Skia's GL backend, exactly as neovide-editor's does; same
# version and features, so no second Skia build.
skia-safe = { version = "0.153.3", features = ["gl"] }
libloading = "0.9.0"
# Wakes the GTK main loop from the terminal's session thread (`glib::spawn_future_local` awaits the
# receiver). Already in the graph through glib/gio at this version. Floor is 0.3.32, not 0.3: that's
# where `UnboundedReceiver::recv` (used in terminal/pane.rs) was added -- 0.3.31 has no such method
# (fix round 1, review finding 2; checked against both versions' sources in the local registry
# cache). The lockfile happened to pin 0.3.34, which is why this only mattered on paper before now.
futures-channel = "0.3.32"

[dev-dependencies]
# Only to name a `TermMode` in a test: `terminal/keys.rs` checks a bare modifier's kitty code through
# the real `terminal_input::encode`, which takes one (GUI pass 2026-09-23, defect 2). The version the
# terminal crates already resolve, so it adds no crate to the graph and ships in no binary.
alacritty_terminal = "0.26.0"

# A plain `main`, because GTK must own the main thread; opt-in with `-- --ignored` and needs an X
# server of its own (`xvfb-run -a ... env GDK_BACKEND=x11 ...`, see the file's header). Holds the GUI
# pass's D1 (2026-09-24): a colorscheme change reaching a widget that first shows after it.
[[test]]
name = "hidden_widget_restyle"
harness = false
