[workspace]
resolver = "2"
members = [
    "poc/gl_skia_test",
    "poc/neovide_embed",
    "poc/neovide_embed_live",
    "poc/pump_events_spike",
    "poc/shell_chrome",
    "poc/shell_composed",
    "poc/tools/wlr_vptr_drag",
    "poc/webkit_pane",
    "neovide-editor",
    "shell",
    "agent",
    "core",
    "remote",
    "server",
    "server-proto",
    "panel",
    "mac",
    "terminal/engine",
    "terminal/frame",
    "terminal/input",
    "terminal/render",
    "terminal/sync",
]
# The Neovide fork is a submodule with its own workspace; it is a path dependency, not a member.
exclude = ["neovide"]
# `poc/` keeps `gtk4`'s `v4_18` feature (frozen) while the product crates below
# hold the v4.14 floor (the floor the release binaries are built against). Cargo's resolver 2
# unifies features across every package in one invocation, so a bare `cargo build --workspace`
# would re-enable v4_18 on `gtk4` for everyone and need GTK 4.18 at pkg-config time; listing the
# product crates here means a bare `cargo build`/`cargo test` (no `-p`, no `--workspace`) builds
# exactly the product at the 4.14 floor, while `--workspace` still reaches `poc/` at 4.18 for
# whoever asks for it explicitly.
default-members = [
    "shell",
    "neovide-editor",
    "agent",
    "core",
    "remote",
    "server",
    "server-proto",
    "panel",
    "mac",
    "terminal/engine",
    "terminal/frame",
    "terminal/input",
    "terminal/render",
    "terminal/sync",
]

[workspace.package]
# One `[workspace.package] version` inherited by every product crate; `release.sh` refuses when its
# argument and this disagree. The first public release is 0.2.0, not 1.0.0 (an earlier plan said
# 1.0.0 and was reversed on 2026-09-29). Release candidates are
# `0.2.0-rc.N`. "v1" stays the internal milestone name; this field only ever carries the public
# SemVer.
version = "0.3.0"
edition = "2021"
publish = false

# Verdandi's protocol crate, pinned once for every crate that speaks it (agent, server: `workspace = true`), so the
# window, the helper and the sidecar never build against two revisions of it. The pin moves together with
# `agent::EXPECTED_VERDANDI_REVISION`, and publish/export.sh rewrites this line for the public tree.
[workspace.dependencies]
claude-runtime-protocol = { git = "https://github.com/HunterGrey-cyber/verdandi.git", rev = "842d54e6c4cccf4aa71e8ded54c020c0253ad78e" }

# The Neovide fork builds against Neovide's own nvim-rs branch (its `[patch.crates-io]`), which a
# dependency's patch section cannot give this workspace: nvim-rs master plus "drain queued
# notifications before reporting RPC EOF". Pinned by commit, never the branch. LGPL-3.0 like the
# crates.io release; `packaging/collect-licenses.py` reads its texts from the git checkout.
[patch.crates-io]
nvim-rs = { git = "https://github.com/neovide/nvim-rs", rev = "7f41ba0c23457c858dc3e9afb3b5de527850ca73" }
