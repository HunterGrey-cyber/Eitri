[workspace]
resolver = "2"
members = [
    "poc/gl_skia_test",
    "poc/neovide_embed",
    "poc/neovide_embed_live",
    "poc/pump_events_spike",
    "poc/shell_chrome",
    "poc/shell_composed",
    "poc/tools/wlr_vptr_drag",
    "poc/webkit_pane",
    "neovide-editor",
    "shell",
    "agent",
    "core",
    "panel",
    "mac",
    "supervisor",
    "terminal",
    "terminal-frame",
    "terminal-input",
    "terminal-render",
    "terminal-sync",
]
# The Neovide fork is a submodule with its own workspace; it is a path dependency, not a member.
exclude = ["neovide"]
# `poc/` keeps `gtk4`'s `v4_18` feature (frozen; the ADR says so) while the product crates below
# hold the v4.14 floor (spec 2026-09-27-v1-dist-design.md §2.1, plan Task 2). Cargo's resolver 2
# unifies features across every package in one invocation, so a bare `cargo build --workspace`
# would re-enable v4_18 on `gtk4` for everyone and need GTK 4.18 at pkg-config time; listing the
# product crates here means a bare `cargo build`/`cargo test` (no `-p`, no `--workspace`) builds
# exactly the product at the 4.14 floor, while `--workspace` still reaches `poc/` at 4.18 for
# whoever asks for it explicitly.
default-members = [
    "shell",
    "neovide-editor",
    "agent",
    "core",
    "panel",
    "mac",
    "supervisor",
    "terminal",
    "terminal-frame",
    "terminal-input",
    "terminal-render",
    "terminal-sync",
]

[workspace.package]
# Spec docs/superpowers/specs/2026-09-27-v1-dist-design.md §3, D1: one `[workspace.package] version`
# inherited by every product crate; `release.sh` (Task 12) refuses when its argument and this
# disagree. Correction (2026-09-29, the private review notes "Answered today"):
# the owner reversed D1 -- the first public release is 0.2.0, not 1.0.0. Release candidates are
# `0.2.0-rc.N`. "v1" stays the internal milestone name; this field only ever carries the public
# SemVer.
version = "0.2.1"
edition = "2021"
publish = false
