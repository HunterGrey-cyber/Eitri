[workspace]
resolver = "2"
members = [
    "poc/gl_skia_test",
    "poc/neovide_embed",
    "poc/neovide_embed_live",
    "poc/pump_events_spike",
    "poc/shell_chrome",
    "poc/shell_composed",
    "poc/tools/wlr_vptr_drag",
    "poc/webkit_pane",
    "neovide-editor",
    "shell",
    "agent",
    "core",
    "supervisor",
    "terminal",
    "terminal-frame",
    "terminal-input",
    "terminal-render",
    "terminal-sync",
]
# The Neovide fork is a submodule with its own workspace; it is a path dependency, not a member.
exclude = ["neovide"]
# `poc/` keeps `gtk4`'s `v4_18` feature (frozen) while the product crates below
# hold the v4.14 floor. Cargo's resolver 2
# unifies features across every package in one invocation, so a bare `cargo build --workspace`
# would re-enable v4_18 on `gtk4` for everyone and need GTK 4.18 at pkg-config time; listing the
# product crates here means a bare `cargo build`/`cargo test` (no `-p`, no `--workspace`) builds
# exactly the product at the 4.14 floor, while `--workspace` still reaches `poc/` at 4.18 for
# whoever asks for it explicitly.
default-members = [
    "shell",
    "neovide-editor",
    "agent",
    "core",
    "supervisor",
    "terminal",
    "terminal-frame",
    "terminal-input",
    "terminal-render",
    "terminal-sync",
]

[workspace.package]
# v1.0.0 as a SemVer major, one
# `[workspace.package] version` inherited by every product crate. Release candidates are
# `1.0.0-rc.N`; `release.sh` refuses when its argument and this disagree.
version = "1.0.0-rc.3"
edition = "2021"
publish = false
