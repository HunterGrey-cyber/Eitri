[workspace]
resolver = "2"
members = [
    "poc/gl_skia_test",
    "poc/neovide_embed",
    "poc/neovide_embed_live",
    "poc/pump_events_spike",
    "poc/shell_chrome",
    "poc/shell_composed",
    "poc/tools/wlr_vptr_drag",
    "poc/webkit_pane",
    "neovide-editor",
    "shell",
    "agent",
    "core",
    "supervisor",
    "terminal",
    "terminal-frame",
    "terminal-input",
    "terminal-render",
    "terminal-sync",
]
# The Neovide fork is a submodule with its own workspace; it is a path dependency, not a member.
exclude = ["neovide"]

[workspace.package]
edition = "2021"
publish = false
