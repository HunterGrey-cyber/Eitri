[package]
name = "eitri-server"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
agent = { path = "../agent" }
eitri-core = { path = "../core" }
eitri-server-proto = { path = "../server-proto" }
eitri-terminal = { path = "../terminal/engine", default-features = false }
# Every crate below is already in the workspace lock through `agent` or `tonic`; the helper adds no registry package.
claude-runtime-protocol = { workspace = true }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "signal", "process", "io-util", "io-std", "fs"] }
tokio-stream = "0.1"
tower = "0.5"
tower-service = "0.3"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[[bin]]
name = "eitri-server"
path = "src/main.rs"
