syntax = "proto3";
package eitri.server.v1;

// Verdandi's RuntimeService shares this connection. Calls name a sidecar in "eitri-sidecar"
// metadata; WatchSessionEvents returns the decimal journal head in "eitri-journal-head".
service Helper {
  rpc Hello(HelloRequest) returns (HelloResponse);
  rpc StartSidecar(StartSidecarRequest) returns (StartSidecarResponse);
  rpc StopSidecar(StopSidecarRequest) returns (StopSidecarResponse);
  rpc ListSidecars(ListSidecarsRequest) returns (ListSidecarsResponse);
  rpc Pending(PendingRequest) returns (PendingResponse);
  rpc TrustScan(TrustScanRequest) returns (TrustScanResponse);

  rpc SyncIgnores(SyncIgnoresRequest) returns (SyncIgnoresResponse);
  rpc GitConfig(GitConfigRequest) returns (GitConfigResponse);
  rpc ListTree(ListTreeRequest) returns (stream ListTreeEntry);
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileChunk);
  rpc ReplaceFileIf(ReplaceFileIfRequest) returns (ReplaceFileIfResponse);
  rpc RemoveFileIf(RemoveFileIfRequest) returns (RemoveFileIfResponse);
  rpc WaitFileHash(WaitFileHashRequest) returns (WaitFileHashResponse);
  rpc PathSizes(PathSizesRequest) returns (PathSizesResponse);
  rpc ProjectActivity(ProjectActivityRequest) returns (ProjectActivityResponse);
  rpc WatchModes(WatchModesRequest) returns (WatchModesResponse);
  rpc Exec(stream ExecInput) returns (stream ExecOutput);
}
message HelloRequest { uint32 protocol_major = 1; uint32 protocol_minor = 2; string client_version = 3; }
enum LoginEnvState {
  LOGIN_ENV_STATE_CAPTURING = 0;
  LOGIN_ENV_STATE_CAPTURED = 1;
  LOGIN_ENV_STATE_FALLBACK_MINIMAL = 2;
  // Account lookup failed; the next start retries it.
  LOGIN_ENV_STATE_UNAVAILABLE = 3;
}
message HelloResponse {
  uint32 protocol_major = 1; uint32 protocol_minor = 2; repeated string capabilities = 3;
  string helper_version = 4; string helper_build = 5; string sidecar_revision = 6;
  repeated string warnings = 7;
  LoginEnvState login_env = 8;
  string daemon_instance = 9;
  string boot_id = 10;
  // The mode keepers' lines, per root; they are not in `warnings`.
  repeated SyncModeWarning mode_warnings = 11;
}
message StartSidecarRequest {
  string root = 1; string account = 2; map<string, string> env = 3; string command_id = 4;
  // The client's expected revision and hash are checked before starting the sidecar.
  string sidecar_revision = 5; string sidecar_sha256 = 6;
}
message StartSidecarResponse { string sidecar_id = 1; }
message StopSidecarRequest { string sidecar_id = 1; string command_id = 2; }
message StopSidecarResponse {}
message ListSidecarsRequest {}
message SessionInfo { string session_id = 1; uint64 journal_head = 2; bool closed = 3; uint64 pending = 4; }
message SidecarInfo {
  string sidecar_id = 1; string root = 2; string account = 3; uint32 pid = 4; uint64 started_unix_ms = 5;
  bool alive = 6; repeated SessionInfo sessions = 7; string helper_version = 8; bool handshake = 9;
}
message ListSidecarsResponse {
  repeated SidecarInfo sidecars = 1; repeated string warnings = 2; LoginEnvState login_env = 3;
}
message PendingRequest { string sidecar_id = 1; string session_id = 2; }
// SessionEvent bytes are retained as received.
message PendingPermission { uint64 sequence = 1; bytes event = 2; }
message PendingResponse { repeated PendingPermission requests = 1; }
message TrustScanRequest { string root = 1; string profile_key = 2; }
message TrustScanResponse { bytes discovery_json = 1; string refusal = 2; }

// Remote sync (M2)
message SyncIgnoresRequest { string root = 1; }
message SyncIgnoresResponse {
  repeated string patterns = 1; repeated string tracked_ignored = 2; string digest = 3;
  repeated string problems = 4; string refusal = 5;
}
message GitConfigRequest { string root = 1; }
// In file order; a key may repeat (remote.<name>.fetch often does).
message GitConfigEntry { string key = 1; string value = 2; }
message GitConfigResponse { repeated GitConfigEntry entries = 1; string digest = 2; string refusal = 3; }
message ListTreeRequest { string root = 1; repeated string patterns = 2; uint64 budget = 3; }
message ListTreeEntry { string rel = 1; string kind = 2; uint64 size = 3; bool truncated = 4; string refusal = 5; }
message ReadFileRequest { string root = 1; string rel = 2; uint64 limit = 3; }
// Data chunks are at most 64 KiB; the final chunk carries the digest and kind.
message ReadFileChunk { bytes data = 1; string sha256 = 2; string kind = 3; string refusal = 4; }
// File reads are capped at 256 MiB, compare-and-replace contents at 8 MiB.
message ReplaceFileIfRequest { string root = 1; string rel = 2; string expected_sha256 = 3; bytes data = 4; }
message ReplaceFileIfResponse { bool replaced = 1; string refusal = 2; }
message RemoveFileIfRequest { string root = 1; string rel = 2; string expected_sha256 = 3; }
message RemoveFileIfResponse { bool removed = 1; string refusal = 2; }
message WaitFileHashRequest { string root = 1; string rel = 2; string sha256 = 3; uint64 timeout_ms = 4; }
message WaitFileHashResponse { bool matched = 1; string observed = 2; string refusal = 3; }
message PathSizesRequest { string root = 1; repeated string rels = 2; repeated string patterns = 3; uint64 budget = 4; bool whole_root = 5; }
message PathSize { string rel = 1; uint64 bytes = 2; }
message PathSizesResponse { repeated PathSize sizes = 1; bool truncated = 2; string refusal = 3; }
message ProjectActivityRequest { string root = 1; }
// `tasks_running`: background tasks (not ambient) the sessions' last rosters list; they write outside any turn.
message ProjectActivityResponse { uint32 turns_running = 1; bool unknown = 2; string refusal = 3; uint32 tasks_running = 4; }
// `staging_name`: the tree session's neighbouring staging directory (`.mutagen-temporary-staging-<session>-beta`).
message WatchModesRequest { string root = 1; repeated string patterns = 2; bool on = 3; string staging_name = 4; }
// `host` is the server's own name, which `refusal` uses; the laptop shows the host as the person typed it.
// `settling`: the keeper had not looked at every change made before the registration (its first walk still running,
// or another daemon still holding the root) when the answer was sent; asking again waits for it again.
message WatchModesResponse { string refusal = 1; string host = 2; bool settling = 3; }
// A mode keeper's line, with the server's own name and the root apart from the text, and the paths it names.
// `sequence` grows with each write the keeper counts (0 on other lines) and `epoch` is new at every keeper start:
// every Hello repeats a line, and the laptop shows a (host, root)'s counted line only when its (epoch, sequence)
// differs from the last one it showed.
message SyncModeWarning {
  string host = 1; string root = 2; string text = 3; repeated string paths = 4; uint64 sequence = 5; uint64 epoch = 6;
}
enum ExecPurpose {
  EXEC_PURPOSE_UNSPECIFIED = 0;
  EXEC_PURPOSE_GIT = 1;
  EXEC_PURPOSE_COMMAND = 2;
}
message ExecStart { string cwd = 1; repeated string argv = 2; ExecPurpose purpose = 3; }
message ExecInput { oneof input { ExecStart start = 1; bytes stdin = 2; bool close = 3; } }
message ExecExit { int32 code = 1; int32 signal = 2; string refusal = 3; }
message ExecOutput { oneof output { bytes stdout = 1; bytes stderr = 2; ExecExit exit = 3; } }
