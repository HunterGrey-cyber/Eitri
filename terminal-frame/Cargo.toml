[package]
name = "terminal-frame"
version.workspace = true
edition = "2021"
publish = false
license = "MIT"
# Moved from Verdandi (`crates/terminal-frame` @ e5f9cc3) into neovibe on 2026-09-23, the owner's decision 4.1(a)
# in docs/superpowers/specs/2026-09-23-bottom-terminal-design.md: neovibe is its only product consumer.
# Verdandi stated no licence for it; it is the owner's own code, MIT with the rest of neovibe from here.
description = "TerminalFrame: the stable Verdandi presentation contract, its projection from an authoritative alacritty_terminal::Term, and the wire encodings it is measured with."

# alacritty_terminal is the ONLY dependency. `vte` is reached through
# `alacritty_terminal::vte`, the exact version it was compiled against, so a
# two-vte-versions-in-one-binary mistake is structurally impossible -- the same
# rule terminal-sync follows.
[dependencies]
alacritty_terminal = "0.26.0"
bitflags = "2"

[dev-dependencies]
libc = "0.2"

[features]
default = []
