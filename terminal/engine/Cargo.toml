[package]
name = "eitri-terminal"
version.workspace = true
edition = "2024"
publish.workspace = true
license = "MIT"
description = "The bottom terminal's engine: an owned PTY, one session thread per terminal, and the Skia paint of a terminal-render PaintList. GTK-free by construction (src/manifest_guard.rs)."

# Never gtk4/glib/gdk/webkit6, used or not -- `src/manifest_guard.rs` rejects those dependencies.
# The GTK half lives in `shell/src/terminal/`; macOS hosts this crate in an NSView, so the
# toolkit boundary belongs here rather than at shell.
[features]
default = ["paint"]
paint = ["dep:skia-safe"]

[dependencies]
terminal-render = { path = "../render" }
terminal-frame = { path = "../frame" }
terminal-sync = { path = "../sync" }
terminal-input = { path = "../input" }
# The one emulator. Same version the four crates above resolve; never `alacritty_terminal::tty` --
# see `src/pty.rs` for the five reasons.
alacritty_terminal = "0.26.0"
# `openpty` itself. Already in the graph through `alacritty_terminal`, so this adds no crate.
rustix-openpty = "0.2.0"
# termios (IUTF8, TIOCSWINSZ) through rustix rather than raw ioctls. Same version rustix-openpty
# re-exports; `std` so an `Errno` converts into `std::io::Error`.
rustix = { version = "1", features = ["std", "termios"] }
# `setsid`/`TIOCSCTTY`/`signal` in the child's `pre_exec`, `poll`, `kill`, `waitpid`, `getpwuid_r`.
libc = "0.2"
skia-safe = { version = "0.156.0", optional = true }
# How many cells an input method's preedit character takes (`src/preedit.rs`): the same crate and
# version `alacritty_terminal` measures printed characters with, so a committed `你好` lands in the
# cells its preedit showed. Already in the graph; this adds no crate.
unicode-width = "0.2"
# The replay record a moving terminal travels in. Already shipped through `eitri-core`; this adds no crate.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# `source_scan` reads this crate's manifest in `src/manifest_guard.rs`. Test builds only, so a release build of the
# engine does not link it. `eitri-core` depends on this crate without default features; Cargo allows that cycle
# only because this side is a dev-dependency, and the test build links a second copy of the engine for it.
eitri-core = { path = "../../core", features = ["test-support"] }
# The replay test counts vte's own "[unhandled ...]" debug records.
log = "0.4"
# A replay's serialisation round trip. Already in the lock through `eitri-core`.
serde_json = "1"

# These integration targets use Skia directly or through their shared raster helpers.
[[test]]
name = "corpus"
required-features = ["paint"]

[[test]]
name = "golden"
required-features = ["paint"]

[[test]]
name = "perf"
required-features = ["paint"]

[[test]]
name = "pty"
required-features = ["paint"]

[[test]]
name = "render"
required-features = ["paint"]

[[test]]
name = "replay_handover"
required-features = ["paint"]

[[test]]
name = "session"
required-features = ["paint"]

[[test]]
name = "throughput"
required-features = ["paint"]
