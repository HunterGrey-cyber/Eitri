[package]
name = "neovide-editor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "neovide_editor"

[features]
fault-injection = []

[dependencies]
gtk4 = { version = "0.11.4", features = ["v4_14"] }
# `fstat` and `dup2` for `stdin::detach_stdin_from_nvim`, which std does not expose. Already in the
# shipped binary through `agent`, so this adds no crate to what `shell` links.
libc = "0.2"
libloading = "0.9.0"
skia-safe = { version = "0.156.0", features = ["gl"] }
# The patched Neovide fork (branch `neovibe-integration`), pinned to a real commit rather than
# tracking the branch live -- a standing constraint
# keeps this fork's divergence scoped to surface/geometry/input-adapter/
# renderer-viewport concerns, so pinning matters: an unreviewed later commit on the branch
# should never silently change what a `cargo build` here actually compiles against. Bump the
# `rev` deliberately (and re-verify) when the fork gains something this crate needs.
neovide = { path = "../neovide" }
# msgpack values: `NeovideEditorPane::exec_lua` takes its arguments and hands back its answer as
# `rmpv::Value`, the type nvim-rs speaks (the fork already links this same version, so nothing new
# is built or shipped). `nvim_child`'s ending tests use it too, to talk to nvim over a pipe.
rmpv = "1"
# `NeovideEditorPane::exec_lua_watched` tells a request that lost its connection from one nvim answered with an
# error by nvim-rs's `CallError`. The fork links this same version with `use_tokio`, so nothing new is built or
# shipped.
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
# Winit already brings this version, so nothing new is built or shipped.
wayland-client = "=0.31.15"
# Winit already enables client_system at this version, so nothing new is built or shipped.
wayland-backend = { version = "=0.3.17", features = ["client_system"] }
# Winit already enables client and staging (single-pixel buffers, the editor's underlay) at this version, so nothing
# new is built or shipped.
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }

# `nvim_rpc`'s real-nvim test: a request and its watch made from plain threads over an nvim-rs
# connection that lives on a tokio runtime, as the fork's does. Both crates are already in the tree
# through the fork (nvim-rs 0.9.2 with `use_tokio`, tokio "full"), so this adds no package.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process"] }
# `tests/no_force_quit.rs` reads `cargo metadata` to find the pinned fork's source. Already in
# Cargo.lock through `eitri-core`, so nothing new is downloaded.
serde_json = "1"
# `tests/fd_watch_*.rs` need only GLib's main context, no display: they name the crate directly so the
# display-guard scan (`shell/tests/own_display_scan.rs`) does not read them as opening one. The
# version gtk4 0.11.4 already resolves.
glib = "0.22"
# Winit already brings this version and these features; the foreign-display stand-in adds no code.
wayland-sys = { version = "=0.31.11", features = ["client", "dlopen"] }

# A plain `main`, not libtest: each real `LiveHarness` case runs in a fresh child copy of this
# binary, one case per child, so it can start its own Xvfb before anything connects to a display and
# keep GTK and winit on that child's main thread.
[[test]]
name = "unfocused_cursor"
harness = false

[[test]]
name = "fullscreen_setting"
harness = false

[[test]]
name = "scale_factor_setting"
harness = false

[[test]]
name = "cursor_animation"
harness = false

[[test]]
name = "os_scale_factor"
harness = false

[[test]]
name = "multi_nvim"
harness = false

# The window's nvim floor against real nvims below and above Neovide's own 0.12; like `multi_nvim`.
[[test]]
name = "nvim_floor"
harness = false

# Opens files as nvim arguments after `--embed` against real nvims; each case starts its own harness in
# a child copy of this binary, like `multi_nvim`.
[[test]]
name = "open_at_start"
harness = false

[[test]]
name = "shared_watch"
harness = false

[[test]]
name = "realized_restart"
harness = false

[[test]]
name = "subsurface_x11"
harness = false

# Each case runs in a child copy of this binary: an abort in one (libwayland aborts on an event for a
# freed queue) fails that case alone, and the parent reads the child's stderr for libwayland's warnings.
[[test]]
name = "presenter_thread"
harness = false

# The fork's harness attached to a running `nvim --listen` (`LiveHarnessOptions::server`); each case runs in a child copy
# of this binary on its own Xvfb, like `multi_nvim`.
[[test]]
name = "fork_attach"
harness = false

# A pane attached to a person's running nvim (`NeovideEditorPaneOptions::attach`), started through a TUI in a private
# tmux; each case runs in a child copy of this binary on its own Xvfb, like `realized_restart`.
[[test]]
name = "attached_pane_with_real_nvim"
harness = false

# The editor following its own nvim's `:restart` and `:connect`; each case runs in a child copy on its own `Xvfb`.
[[test]]
name = "owned_follow"
harness = false
