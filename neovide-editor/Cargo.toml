[package]
name = "neovide-editor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "neovide_editor"

[dependencies]
gtk4 = { version = "0.11.4", features = ["v4_18"] }
# `fstat` and `dup2` for `stdin::detach_stdin_from_nvim`, which std does not expose. Already in the
# shipped binary through `agent`, so this adds no crate to what `shell` links.
libc = "0.2"
libloading = "0.9.0"
skia-safe = { version = "0.153.3", features = ["gl"] }
# The patched Neovide fork (branch `neovibe-integration`), pinned to a real commit rather than
# tracking the branch live -- this project's own `neovibe_architecture_decisions.md` §13
# constraint keeps this fork's divergence scoped to surface/geometry/input-adapter/
# renderer-viewport concerns, so pinning matters: an unreviewed later commit on the branch
# should never silently change what a `cargo build` here actually compiles against. Bump the
# `rev` deliberately (and re-verify) when the fork gains something this crate needs.
neovide = { path = "../neovide" }

# `nvim_rpc`'s real-nvim test: a request and its watch made from plain threads over an nvim-rs
# connection that lives on a tokio runtime, as the fork's does. Both crates are already in the tree
# through the fork (nvim-rs 0.9.2 with `use_tokio`, tokio "full"), so this adds no package.
[dev-dependencies]
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "process"] }
# `tests/no_force_quit.rs` reads `cargo metadata` to find the pinned fork's source. Already in
# Cargo.lock through `neovibe-core`, so nothing new is downloaded.
serde_json = "1"
# msgpack for `nvim_child`'s ending tests, which talk to nvim over a pipe they can close. In
# Cargo.lock through the fork already.
rmpv = "1"

# A plain `main`, not libtest: winit allows one `EventLoop` per process and only on the main
# thread, so each real `LiveHarness` case runs in a fresh child copy of this binary.
[[test]]
name = "unfocused_cursor"
harness = false

[[test]]
name = "fullscreen_setting"
harness = false

[[test]]
name = "scale_factor_setting"
harness = false

[[test]]
name = "cursor_animation"
harness = false

[[test]]
name = "os_scale_factor"
harness = false
